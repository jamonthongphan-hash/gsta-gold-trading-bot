<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Gold Trading Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1c1917; }
        ::-webkit-scrollbar-thumb { background: #78350f; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b45309; }
        body { background-color: #0c0a09; }
        .blink { animation: blink 1.2s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .score-bar { transition: width 0.6s ease; }
    </style>
</head>
<body class="text-stone-100 font-sans min-h-screen">
<div id="root"></div>
<div id="error-overlay" style="display:none;position:fixed;inset:0;background:#0c0a09;z-index:9999;padding:24px;font-family:monospace;overflow:auto;"></div>
<script>
window.onerror = function(msg, src, line, col, err) {
  var el = document.getElementById('error-overlay');
  el.style.display = 'block';
  el.innerHTML = '<h2 style="color:#f87171;font-size:20px;margin-bottom:12px">⚠️ JavaScript Error</h2>'
    + '<p style="color:#fbbf24;font-size:15px;margin-bottom:8px">' + msg + '</p>'
    + '<p style="color:#94a3b8;font-size:12px">Line: ' + line + ' | Col: ' + col + '</p>'
    + '<p style="color:#64748b;font-size:11px;margin-top:8px">' + src + '</p>'
    + (err && err.stack ? '<pre style="color:#94a3b8;font-size:11px;margin-top:12px;white-space:pre-wrap">' + err.stack.slice(0,800) + '</pre>' : '');
};
window.addEventListener('unhandledrejection', function(e) {
  var el = document.getElementById('error-overlay');
  el.style.display = 'block';
  el.innerHTML += '<h3 style="color:#fb923c;margin-top:16px">Unhandled Promise Rejection</h3>'
    + '<p style="color:#fbbf24">' + (e.reason?.message || String(e.reason)) + '</p>';
});
</script>
<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ═══════════════════════════════════════════════════════
    //  INDICATOR HELPERS
    // ═══════════════════════════════════════════════════════
    const calcEMAArray = (closes, period) => {
        if (closes.length < period) return [];
        const k = 2 / (period + 1);
        const result = [];
        let ema = closes.slice(0, period).reduce((a, b) => a + b, 0) / period;
        result.push(ema);
        for (let i = period; i < closes.length; i++) { ema = closes[i] * k + ema * (1 - k); result.push(ema); }
        return result;
    };
    const calcEMA = (closes, period) => { const a = calcEMAArray(closes, period); return a.length ? a[a.length - 1] : 0; };

    // RSI ที่ถูกต้อง: Wilder's Smoothing Method (มาตรฐาน TradingView)
    const calcRSI = (closes, period = 14) => {
        if (closes.length < period + 2) return 50;
        let avgGain = 0, avgLoss = 0;
        // Initial average (first period)
        for (let i = 1; i <= period; i++) {
            const d = closes[i] - closes[i - 1];
            if (d > 0) avgGain += d; else avgLoss -= d;
        }
        avgGain /= period; avgLoss /= period;
        // Wilder smoothing for remaining candles
        for (let i = period + 1; i < closes.length; i++) {
            const d = closes[i] - closes[i - 1];
            avgGain = (avgGain * (period - 1) + (d > 0 ? d : 0)) / period;
            avgLoss = (avgLoss * (period - 1) + (d < 0 ? -d : 0)) / period;
        }
        if (avgLoss === 0) return 100;
        return parseFloat((100 - 100 / (1 + avgGain / avgLoss)).toFixed(2));
    };

    const calcMACD = (closes) => {
        if (closes.length < 35) return { macd: 0, signal: 0, histogram: 0, prevHistogram: 0, trend: 'neutral' };
        const ema12 = calcEMAArray(closes, 12), ema26 = calcEMAArray(closes, 26);
        const minLen = Math.min(ema12.length, ema26.length);
        const macdArr = ema12.slice(ema12.length - minLen).map((v, i) => v - ema26[i]);
        const sigArr = calcEMAArray(macdArr, 9);
        const alignedMacd = macdArr.slice(macdArr.length - sigArr.length);
        const macd = alignedMacd[alignedMacd.length - 1] || 0;
        const signal = sigArr[sigArr.length - 1] || 0;
        const histogram = macd - signal;
        const prevMacd = alignedMacd.length > 1 ? alignedMacd[alignedMacd.length - 2] : macd;
        const prevSignal = sigArr.length > 1 ? sigArr[sigArr.length - 2] : signal;
        const prevHistogram = prevMacd - prevSignal;
        let trend = 'neutral';
        if (macd > signal && histogram > 0 && histogram > prevHistogram) trend = 'bullish';
        else if (macd < signal && histogram < 0 && histogram < prevHistogram) trend = 'bearish';
        else if (macd > signal) trend = 'weak_bullish';
        else if (macd < signal) trend = 'weak_bearish';
        return { macd: +macd.toFixed(3), signal: +signal.toFixed(3), histogram: +histogram.toFixed(3), prevHistogram: +prevHistogram.toFixed(3), trend };
    };

    const calcBB = (closes, period = 20, mult = 2) => {
        if (closes.length < period) return { upper: 0, middle: 0, lower: 0, bandwidth: 0, pctB: 50, squeeze: false };
        const slice = closes.slice(-period);
        const sma = slice.reduce((a, b) => a + b, 0) / period;
        const std = Math.sqrt(slice.reduce((a, b) => a + Math.pow(b - sma, 2), 0) / period);
        const upper = sma + mult * std, lower = sma - mult * std;
        const bw = (upper - lower) / sma * 100;
        const cur = closes[closes.length - 1];
        return { upper: +upper.toFixed(2), middle: +sma.toFixed(2), lower: +lower.toFixed(2), bandwidth: +bw.toFixed(2), pctB: +((cur - lower) / (upper - lower) * 100).toFixed(1), squeeze: bw < 1.5 };
    };

    const calcATR = (candles, period = 14) => {
        if (candles.length < period + 1) return 5;
        const trs = [];
        for (let i = 1; i < candles.length; i++) {
            const [, , h, l, , ] = candles[i]; const pc = candles[i - 1][4];
            trs.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
        }
        return +(trs.slice(-period).reduce((a, b) => a + b, 0) / period).toFixed(2);
    };

    // Stochastic ที่ถูกต้อง: rawK → %K (SMA3 of rawK) → %D (SMA3 of %K)
    const calcStochastic = (candles, kPeriod = 14, smoothK = 3, dPeriod = 3) => {
        if (candles.length < kPeriod + smoothK + dPeriod) return { k: 50, d: 50, prevK: 50, prevD: 50 };
        // Step 1: Raw %K
        const rawK = [];
        for (let i = kPeriod - 1; i < candles.length; i++) {
            const sl = candles.slice(i - kPeriod + 1, i + 1);
            const hi = Math.max(...sl.map(c => c[2])), lo = Math.min(...sl.map(c => c[3]));
            rawK.push(hi === lo ? 50 : (candles[i][4] - lo) / (hi - lo) * 100);
        }
        // Step 2: %K = SMA(smoothK) of rawK
        const kVals = [];
        for (let i = smoothK - 1; i < rawK.length; i++) {
            kVals.push(rawK.slice(i - smoothK + 1, i + 1).reduce((a, b) => a + b, 0) / smoothK);
        }
        // Step 3: %D = SMA(dPeriod) of %K
        const dVals = [];
        for (let i = dPeriod - 1; i < kVals.length; i++) {
            dVals.push(kVals.slice(i - dPeriod + 1, i + 1).reduce((a, b) => a + b, 0) / dPeriod);
        }
        const k    = kVals.length ? kVals[kVals.length - 1] : 50;
        const d    = dVals.length ? dVals[dVals.length - 1] : 50;
        const prevK = kVals.length > 1 ? kVals[kVals.length - 2] : k;
        const prevD = dVals.length > 1 ? dVals[dVals.length - 2] : d;
        return { k: +k.toFixed(2), d: +d.toFixed(2), prevK: +prevK.toFixed(2), prevD: +prevD.toFixed(2) };
    };

    // Williams %R — Leading Oscillator (เร็วกว่า Stochastic, ไม่มี Smoothing)
    // %R = (Highest High - Close) / (Highest High - Lowest Low) * -100
    // Range: -100 to 0 | Overbought: > -20 | Oversold: < -80 | Middle: -50
    const calcWilliamsR = (candles, period = 14) => {
        if (candles.length < period) return { value: -50, prev: -50, overbought: false, oversold: false, zone: 'neutral' };
        const calc = (offset) => {
            const sl = candles.slice(candles.length - period - offset, candles.length - offset);
            if (sl.length < period) return -50;
            const hh = Math.max(...sl.map(c => c[2]));
            const ll = Math.min(...sl.map(c => c[3]));
            const cl = sl[sl.length - 1][4];
            return hh === ll ? -50 : +((hh - cl) / (hh - ll) * -100).toFixed(2);
        };
        const value = calc(0);
        const prev  = calc(1);
        const overbought = value > -20;   // ราคาสูงมาก — โอกาสลง
        const oversold   = value < -80;   // ราคาต่ำมาก — โอกาสขึ้น
        const crossAbove50 = value > -50 && prev <= -50; // ข้าม -50 ขึ้น = Bullish momentum
        const crossBelow50 = value < -50 && prev >= -50; // ข้าม -50 ลง = Bearish momentum
        const zone = overbought ? 'overbought' : oversold ? 'oversold' : value > -50 ? 'bull_zone' : 'bear_zone';
        return { value, prev, overbought, oversold, crossAbove50, crossBelow50, zone };
    };

    // ADX (Average Directional Index) — วัดความแรงของ trend
    const calcADX = (candles, period = 14) => {
        if (candles.length < period * 2 + 2) return { adx: 20, pdi: 20, mdi: 20, trending: false, strong: false };
        const trArr = [], pDM = [], mDM = [];
        for (let i = 1; i < candles.length; i++) {
            const [,, h, l] = candles[i], [,, ph, pl, pc] = candles[i - 1];
            trArr.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
            const up = h - ph, dn = pl - l;
            pDM.push(up > dn && up > 0 ? up : 0);
            mDM.push(dn > up && dn > 0 ? dn : 0);
        }
        // Wilder smoothing
        let sTR  = trArr.slice(0, period).reduce((a, b) => a + b, 0);
        let sPDM = pDM.slice(0, period).reduce((a, b) => a + b, 0);
        let sMDM = mDM.slice(0, period).reduce((a, b) => a + b, 0);
        const dxArr = [];
        let lastPDI = 20, lastMDI = 20;
        for (let i = period; i < trArr.length; i++) {
            sTR  = sTR  - sTR / period  + trArr[i];
            sPDM = sPDM - sPDM / period + pDM[i];
            sMDM = sMDM - sMDM / period + mDM[i];
            lastPDI = sTR > 0 ? 100 * sPDM / sTR : 0;
            lastMDI = sTR > 0 ? 100 * sMDM / sTR : 0;
            const s = lastPDI + lastMDI;
            dxArr.push(s > 0 ? 100 * Math.abs(lastPDI - lastMDI) / s : 0);
        }
        if (dxArr.length < period) return { adx: 20, pdi: lastPDI, mdi: lastMDI, trending: false, strong: false };
        let adx = dxArr.slice(0, period).reduce((a, b) => a + b, 0) / period;
        for (let i = period; i < dxArr.length; i++) adx = (adx * (period - 1) + dxArr[i]) / period;
        return { adx: +adx.toFixed(2), pdi: +lastPDI.toFixed(2), mdi: +lastMDI.toFixed(2), trending: adx > 22, strong: adx > 30 };
    };

    // Swing High/Low Levels — หาแนวรับแนวต้านจาก Price Action จริง
    const findSwingLevels = (candles, lookback = 80) => {
        const sl = candles.slice(-Math.min(lookback, candles.length));
        const w = 4, res = [], sup = [];
        for (let i = w; i < sl.length - w; i++) {
            const h = sl[i][2], l = sl[i][3];
            let isH = true, isL = true;
            for (let j = i - w; j <= i + w; j++) {
                if (j !== i && sl[j][2] >= h) isH = false;
                if (j !== i && sl[j][3] <= l) isL = false;
            }
            if (isH) res.push(+h.toFixed(2));
            if (isL) sup.push(+l.toFixed(2));
        }
        return {
            resistances: [...new Set(res)].sort((a, b) => a - b).slice(-4),
            supports:    [...new Set(sup)].sort((a, b) => a - b).slice(-4)
        };
    };

    // ── Dow Theory: HH / HL / LH / LL Trend Detection ──────────────────────
    // Uptrend  = Higher High (HH) + Higher Low (HL)
    // Downtrend = Lower High (LH) + Lower Low (LL)
    // Trend-change signals when structure breaks
    const calcDowTheorySwings = (candles, lookback = 50) => {
        if (!candles || candles.length < 12) return { trend:'NEUTRAL', trendChange:false, label:'ไม่มีข้อมูลเพียงพอ', isHH:false, isHL:false, isLH:false, isLL:false };
        const sl = candles.slice(-Math.min(lookback, candles.length));
        const w = 3; // swing detection window
        const swingHi = [], swingLo = [];
        for (let i = w; i < sl.length - w; i++) {
            const h = sl[i][2], l = sl[i][3];
            let isHigh = true, isLow = true;
            for (let j = i - w; j <= i + w; j++) {
                if (j !== i && sl[j][2] >= h) isHigh = false;
                if (j !== i && sl[j][3] <= l) isLow  = false;
            }
            if (isHigh) swingHi.push({ price: h, idx: i });
            if (isLow)  swingLo.push({ price: l, idx: i });
        }
        if (swingHi.length < 2 || swingLo.length < 2)
            return { trend:'NEUTRAL', trendChange:false, label:'Sideways', isHH:false, isHL:false, isLH:false, isLL:false };

        const lastHigh = swingHi[swingHi.length - 1].price;
        const prevHigh = swingHi[swingHi.length - 2].price;
        const lastLow  = swingLo[swingLo.length - 1].price;
        const prevLow  = swingLo[swingLo.length - 2].price;

        const isHH = lastHigh > prevHigh;  // Higher High  → Bullish
        const isHL = lastLow  > prevLow;   // Higher Low   → Bullish
        const isLH = lastHigh < prevHigh;  // Lower High   → Bearish
        const isLL = lastLow  < prevLow;   // Lower Low    → Bearish

        let trend = 'NEUTRAL', trendChange = false, label = 'Sideways';
        if (isHH && isHL)       { trend = 'UP';      label = '▲ Uptrend (HH+HL)'; }
        else if (isLH && isLL)  { trend = 'DOWN';    label = '▼ Downtrend (LH+LL)'; }
        else if (isLH && isHL)  { trend = 'NEUTRAL'; trendChange = true; label = '⚠️ กลับตัวขาลง! (LH)'; }
        else if (isHH && isLL)  { trend = 'NEUTRAL'; trendChange = true; label = '⚠️ กลับตัวขาขึ้น! (HH)'; }
        else                    { trend = 'NEUTRAL'; label = 'Sideways'; }

        return { trend, trendChange, label, isHH, isHL, isLH, isLL, lastHigh, prevHigh, lastLow, prevLow };
    };

    // ── Demand & Supply Zone Detection (DBR / RBR / RBD / DBD) ─────────────
    // Zone = Base (1-4 tight candles) + Imbalance (strong move before/after)
    // Demand: Drop→Base→Rally (DBR) or Rally→Base→Rally (RBR)
    // Supply: Rally→Base→Drop (RBD) or Drop→Base→Drop (DBD)
    // Freshness: FRESH (never tested) | NON_FRESH (tested 1x) | USED_UP (tested 2+x → skip)
    const calcDemandSupplyZones = (candles, currentPrice, atr = 10) => {
        if (!candles || candles.length < 20 || !currentPrice) return { demandZones:[], supplyZones:[] };
        const n = candles.length;
        const atrs = Math.max(atr, 3); // minimum ATR guard
        const result = { demandZones:[], supplyZones:[] };
        const seenZones = new Set(); // avoid duplicates

        for (let i = 4; i < n - 3; i++) {
            // Try base lengths 1–4
            for (let bl = 1; bl <= 4; bl++) {
                if (i + bl >= n - 2) continue;
                const baseCands = candles.slice(i, i + bl);
                const baseHigh  = Math.max(...baseCands.map(c => c[2]));
                const baseLow   = Math.min(...baseCands.map(c => c[3]));
                const baseRange = baseHigh - baseLow;

                // Base must be tight (consolidation)
                if (baseRange === 0 || baseRange > atrs * 1.8) continue;

                // Base candles should be small-body (no big Marubozu running through)
                const bigBodyInBase = baseCands.some(c => Math.abs(c[4]-c[1]) > baseRange * 0.9);
                if (bigBodyInBase) continue;

                // Left context: 2-3 candles before base
                const leftLen = Math.min(3, i);
                const leftCands = candles.slice(i - leftLen, i);
                if (!leftCands.length) continue;
                const leftStart  = leftCands[0][1];            // open of first left candle
                const leftEnd    = leftCands[leftCands.length-1][4]; // close of last left candle
                const leftMove   = Math.abs(leftEnd - leftStart);
                const leftDrop   = leftStart > leftEnd && leftMove > atrs * 0.6;
                const leftRally  = leftStart < leftEnd && leftMove > atrs * 0.6;

                // Right context: 2-3 candles after base
                const rightCands = candles.slice(i + bl, Math.min(n, i + bl + 3));
                if (!rightCands.length) continue;
                const rightStart  = rightCands[0][1];
                const rightEnd    = rightCands[rightCands.length-1][4];
                const rightMove   = Math.abs(rightEnd - rightStart);
                const rightRally  = rightStart < rightEnd && rightMove > atrs * 0.6;
                const rightDrop   = rightStart > rightEnd && rightMove > atrs * 0.6;

                let zoneType = null, pattern = null;
                if      (leftDrop  && rightRally) { zoneType='DEMAND'; pattern='DBR'; }
                else if (leftRally && rightRally) { zoneType='DEMAND'; pattern='RBR'; }
                else if (leftRally && rightDrop)  { zoneType='SUPPLY'; pattern='RBD'; }
                else if (leftDrop  && rightDrop)  { zoneType='SUPPLY'; pattern='DBD'; }
                if (!zoneType) continue;

                // Deduplicate (±0.5% of price)
                const zKey = `${zoneType}_${Math.round(baseLow/5)*5}_${Math.round(baseHigh/5)*5}`;
                if (seenZones.has(zKey)) continue;
                seenZones.add(zKey);

                // Check freshness: count future candles that touched the zone
                const future = candles.slice(i + bl);
                let testCount = 0;
                for (const fc of future) {
                    if (fc[3] <= baseHigh + atrs * 0.1 && fc[2] >= baseLow - atrs * 0.1) testCount++;
                }
                if (testCount >= 3) continue; // USED_UP — skip
                const freshness = testCount === 0 ? 'FRESH' : 'NON_FRESH';

                // Proximal = closest line to current price
                const proximalLine = zoneType === 'DEMAND' ? baseHigh : baseLow;
                const distalLine   = zoneType === 'DEMAND' ? baseLow  : baseHigh;

                // Check if zone is still relevant (not too far from current price)
                const distPct = Math.abs(proximalLine - currentPrice) / currentPrice * 100;
                if (distPct > 5) continue; // more than 5% away → not relevant

                const inZone   = currentPrice >= baseLow - atrs * 0.15 && currentPrice <= baseHigh + atrs * 0.15;
                const nearZone = !inZone && Math.abs(proximalLine - currentPrice) <= atrs * 2;
                const distFromPrice = zoneType === 'DEMAND'
                    ? currentPrice - proximalLine
                    : proximalLine - currentPrice;

                (zoneType === 'DEMAND' ? result.demandZones : result.supplyZones).push({
                    pattern, freshness, proximalLine: +proximalLine.toFixed(2), distalLine: +distalLine.toFixed(2),
                    distFromPrice: +distFromPrice.toFixed(2), inZone, nearZone, age: n - i - bl,
                    baseHigh: +baseHigh.toFixed(2), baseLow: +baseLow.toFixed(2),
                });
            }
        }

        // Sort by proximity and keep best 3 each
        const byProx = (a, b) => Math.abs(a.distFromPrice) - Math.abs(b.distFromPrice);
        result.demandZones = result.demandZones.sort(byProx).slice(0, 3);
        result.supplyZones = result.supplyZones.sort(byProx).slice(0, 3);
        return result;
    };

    const calcFib = (candles, lookback = 50) => {
        if (candles.length < 5) return null;
        const sl = candles.slice(-Math.min(lookback, candles.length));
        const high = Math.max(...sl.map(c => c[2])), low = Math.min(...sl.map(c => c[3]));
        const r = high - low;
        return {
            high: +high.toFixed(2), low: +low.toFixed(2),
            r786: +(low + 0.786 * r).toFixed(2), r618: +(low + 0.618 * r).toFixed(2),
            r500: +(low + 0.500 * r).toFixed(2), r382: +(low + 0.382 * r).toFixed(2),
            r236: +(low + 0.236 * r).toFixed(2), r000: +low.toFixed(2),
            trend: candles[candles.length - 1][4] > candles[candles.length - Math.min(10, candles.length)][4] ? 'up' : 'down'
        };
    };

    // ═══════════════════════════════════════════════════════
    //  DAILY PIVOT POINTS  (Floor Pivot Method)
    //  PP = (H+L+C)/3 | R1=2PP-L | R2=PP+(H-L) | R3=R1+(H-L)
    //  S1=2PP-H | S2=PP-(H-L) | S3=S1-(H-L)
    //  ใช้ข้อมูลวันก่อนหน้า (Previous day H/L/C)
    // ═══════════════════════════════════════════════════════
    const calcPivotPoints = (candles) => {
        if (!candles || candles.length < 24) return null;
        // จัดกลุ่ม Hourly candles เป็นรายวัน (UTC)
        const byDay = {};
        for (const c of candles) {
            const d   = new Date(c[0]);
            const key = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
            if (!byDay[key]) byDay[key] = { h: c[2], l: c[3], c: c[4], ts: c[0] };
            else {
                if (c[2] > byDay[key].h) byDay[key].h = c[2];
                if (c[3] < byDay[key].l) byDay[key].l = c[3];
                byDay[key].c = c[4]; // last candle of day = close
            }
        }
        const days = Object.keys(byDay).sort();
        if (days.length < 2) return null;

        // วันก่อนหน้า (เพราะวันปัจจุบันยังไม่ปิด)
        const prev = byDay[days[days.length - 2]];
        const H = prev.h, L = prev.l, C = prev.c;

        const PP = (H + L + C) / 3;
        const R1 = 2 * PP - L;
        const R2 = PP + (H - L);
        const R3 = R1 + (H - L);
        const S1 = 2 * PP - H;
        const S2 = PP - (H - L);
        const S3 = S1 - (H - L);

        return {
            pp: +PP.toFixed(2),
            r1: +R1.toFixed(2), r2: +R2.toFixed(2), r3: +R3.toFixed(2),
            s1: +S1.toFixed(2), s2: +S2.toFixed(2), s3: +S3.toFixed(2),
            prevH: +H.toFixed(2), prevL: +L.toFixed(2), prevC: +C.toFixed(2),
            prevDate: days[days.length - 2]
        };
    };

    // ═══════════════════════════════════════════════════════
    //  GOLD FIX & INSTITUTIONAL TIMING WINDOWS
    //  London AM Fix: 10:30 London | PM Fix: 15:00 London
    //  COMEX Open: 8:20 NY | LBMA Silver Fix: 12:00 London
    // ═══════════════════════════════════════════════════════

    // หา last Sunday ของเดือน month (0-based) ปี year
    const lastSundayUTC = (year, month) => {
        const d = new Date(Date.UTC(year, month + 1, 0)); // สิ้นเดือน
        d.setUTCDate(d.getUTCDate() - d.getUTCDay()); // ถอยไปหา Sunday
        return d;
    };
    // หา Nth Sunday ของเดือน (n=1 = first Sunday, n=2 = second, ...)
    const nthSundayUTC = (year, month, n) => {
        const d = new Date(Date.UTC(year, month, 1));
        const offset = (7 - d.getUTCDay()) % 7;
        d.setUTCDate(1 + offset + (n - 1) * 7);
        return d;
    };

    const isLondonBST = (date) => {
        // BST: last Sunday of March 01:00 UTC → last Sunday of October 01:00 UTC
        const y = date.getUTCFullYear();
        const start = lastSundayUTC(y, 2); start.setUTCHours(1, 0, 0, 0);
        const end   = lastSundayUTC(y, 9); end.setUTCHours(1, 0, 0, 0);
        return date >= start && date < end;
    };

    const isNYDST = (date) => {
        // EDT: 2nd Sunday of March 07:00 UTC → 1st Sunday of November 06:00 UTC
        const y = date.getUTCFullYear();
        const start = nthSundayUTC(y, 2, 2); start.setUTCHours(7, 0, 0, 0);
        const end   = nthSundayUTC(y, 10, 1); end.setUTCHours(6, 0, 0, 0);
        return date >= start && date < end;
    };

    const getGoldFixWindows = (now = new Date()) => {
        const bst  = isLondonBST(now);
        const nydt = isNYDST(now);
        // London offset: +1 (BST) or +0 (GMT) → UTC = London - offset
        const lonOff = bst  ? 1 : 0;
        // NY offset: -4 (EDT) or -5 (EST) → UTC = NY + |offset|
        const nyOff  = nydt ? 4 : 5;

        // Fix times in UTC
        const amFixH = 10 - lonOff, amFixM = 30;  // 10:30 London
        const pmFixH = 15 - lonOff, pmFixM = 0;   // 15:00 London
        const silverH= 12 - lonOff, silverM= 0;   // 12:00 London (LBMA Silver)
        const comexH  = 8  + nyOff,  comexM = 20;  // 8:20 NY

        const utcH = now.getUTCHours(), utcM = now.getUTCMinutes();
        const nowMins = utcH * 60 + utcM;

        const inWin = (fh, fm, pre = 15, post = 20) => {
            const fixMins = fh * 60 + fm;
            const diff = nowMins - fixMins;
            return diff >= -pre && diff <= post;
        };
        // Minutes to a fix (forward only, wraps to next day)
        const minsTo = (fh, fm) => ((fh * 60 + fm) - nowMins + 1440) % 1440;

        const inAmFix    = inWin(amFixH, amFixM);
        const inPmFix    = inWin(pmFixH, pmFixM);
        const inComex    = inWin(comexH, comexM, 10, 15);
        const inSilver   = inWin(silverH, silverM, 5, 10);

        const active = inAmFix ? 'London AM Fix' : inPmFix ? 'London PM Fix' : inComex ? 'COMEX Open' : inSilver ? 'LBMA Silver Fix' : null;

        // Bangkok time display (UTC+7)
        const toBKK = (h, m) => `${String((h + 7) % 24).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

        // Upcoming fixes sorted by time-to
        const upcoming = [
            { name:'London AM Fix', h:amFixH, m:amFixM, type:'gold' },
            { name:'London PM Fix', h:pmFixH, m:pmFixM, type:'gold' },
            { name:'COMEX Open',    h:comexH, m:comexM, type:'comex' },
            { name:'LBMA Silver',   h:silverH,m:silverM,type:'silver' },
        ].map(f => ({ ...f, minsTo: minsTo(f.h, f.m), bkkTime: toBKK(f.h, f.m) }))
         .sort((a, b) => a.minsTo - b.minsTo);

        return {
            inAmFix, inPmFix, inComex, inSilver,
            active, isActive: !!active,
            upcoming,           // sorted by time
            bst, nydt           // DST flags for display
        };
    };

    const getMarketSessions = () => {
        const h = new Date().getUTCHours();
        const s = [];
        if (h >= 23 || h < 8)  s.push({ name: 'เอเชีย',     color: 'blue',   desc: 'สภาพคล่องปานกลาง' });
        if (h >= 7  && h < 16) s.push({ name: 'ลอนดอน',     color: 'green',  desc: 'สภาพคล่องสูง ⚡' });
        if (h >= 13 && h < 22) s.push({ name: 'นิวยอร์ก',   color: 'red',    desc: 'สภาพคล่องสูงสุด ⚡' });
        if (h >= 13 && h < 16) s.push({ name: 'NY+London',  color: 'yellow', desc: 'Overlap 🔥 โอกาสสูงสุด' });
        if (s.length === 0)    s.push({ name: 'Pre-Market', color: 'gray',   desc: 'หลีกเลี่ยงการเทรด' });
        return s;
    };

    // ═══════════════════════════════════════════════════════
    //  DXY ANALYSIS (US Dollar Index — ผกผันกับทอง ~-0.8)
    // ═══════════════════════════════════════════════════════
    // DXY ขึ้น = ทองมักลง | DXY ลง = ทองมักขึ้น
    // ใช้ EMA ระยะสั้น/กลางเพื่อวัด momentum และทิศทาง
    const calcDXYSignal = (closes) => {
        if (!closes || closes.length < 10) return { trend: 'NEUTRAL', momentum: 0, signal: 'NEUTRAL', strength: 'WEAK' };
        const ema5  = calcEMA(closes, Math.min(5,  closes.length));
        const ema20 = calcEMA(closes, Math.min(20, closes.length));
        const last  = closes[closes.length - 1];
        const prev5 = closes[closes.length - Math.min(6, closes.length)];

        // Momentum: % change over last 5 bars
        const momentum = prev5 > 0 ? ((last - prev5) / prev5) * 100 : 0;

        // Trend direction
        const trend = ema5 > ema20 ? 'RISING' : ema5 < ema20 ? 'FALLING' : 'NEUTRAL';

        // Strength based on momentum magnitude
        const absMom = Math.abs(momentum);
        const strength = absMom >= 0.5 ? 'STRONG' : absMom >= 0.2 ? 'MODERATE' : 'WEAK';

        // Gold signal (inverse): DXY rising = bearish gold, DXY falling = bullish gold
        let signal = 'NEUTRAL';
        if (trend === 'RISING'  && strength !== 'WEAK') signal = 'BEARISH_GOLD';  // DXY ขึ้น = หนุนทองลง
        if (trend === 'FALLING' && strength !== 'WEAK') signal = 'BULLISH_GOLD';  // DXY ลง = หนุนทองขึ้น

        return {
            trend, momentum: +momentum.toFixed(3), signal, strength,
            ema5: +ema5.toFixed(3), ema20: +ema20.toFixed(3), last: +last.toFixed(3)
        };
    };

    // คีย์เวิร์ดข่าวที่กระทบทองโดยตรง — ใช้ block window กว้างกว่า
    // ═══════════════════════════════════════════════════════
    //  DAILY LOSS LIMIT — คำนวณ P&L รายวัน (Bangkok time)
    // ═══════════════════════════════════════════════════════
    const calcDailyStats = (history = [], balance = 0) => {
        const now   = new Date();
        // ใช้เวลาไทย (UTC+7) เพื่อให้ "วันนี้" ตรงกับเทรดเดอร์ไทย
        const bkk   = new Date(now.getTime() + 7 * 3600 * 1000);
        const todayStr = bkk.toISOString().slice(0, 10); // "YYYY-MM-DD"

        const todayTrades = history.filter(t => {
            if (t.status === 'PENDING') return false;
            const d = new Date(new Date(t.time).getTime() + 7 * 3600 * 1000);
            return d.toISOString().slice(0, 10) === todayStr;
        });

        const dailyPnL     = todayTrades.reduce((s, t) => s + (t.profitUsd || 0), 0);
        const dailyLossPct = balance > 0 ? -(dailyPnL / balance * 100) : 0; // บวก = ขาดทุน
        return {
            dailyPnL:     +dailyPnL.toFixed(2),
            dailyLossPct: +Math.max(0, dailyLossPct).toFixed(2), // ≥0 เสมอ (ลบ = กำไร)
            todayCount:   todayTrades.length,
            todayWins:    todayTrades.filter(t => t.status === 'WIN').length,
            todayLosses:  todayTrades.filter(t => t.status === 'LOSS').length,
        };
    };

    // ── Early Exit Advisory for active trades ──────────────────────────────
    const calcExitAdvisory = (trade, aiAnalysis, basicAnalysis, price) => {
        if (!trade || !price || !aiAnalysis) return null;
        const isBuy = trade.signal === 'BUY';
        const slOrig = trade.slOriginal ?? trade.sl;
        const riskDist = Math.abs(trade.entry - slOrig);
        const units = trade.unitsToTrade || 0;
        const pnlNow = isBuy
            ? (price - trade.entry) * units
            : (trade.entry - price) * units;
        const rNow = riskDist > 0
            ? (isBuy ? (price - trade.entry) / riskDist : (trade.entry - price) / riskDist)
            : 0;

        const rsi    = (typeof basicAnalysis?.rsi === 'number' ? basicAnalysis.rsi : basicAnalysis?.rsi?.value) ?? 50;
        const stochK = basicAnalysis?.stoch?.k     ?? 50;
        const willR  = basicAnalysis?.williamsR?.value ?? -50;
        const curSig  = aiAnalysis?.signal;
        const bull    = aiAnalysis?.bullScore ?? 0;
        const bear    = aiAnalysis?.bearScore ?? 0;
        const pnlStr  = (pnlNow >= 0 ? '+' : '') + pnlNow.toFixed(0) + '$';
        const rStr    = (rNow  >= 0 ? '+' : '') + rNow.toFixed(2) + 'R';

        // 1 — สัญญาณกลับทิศสมบูรณ์
        if (isBuy && curSig === 'SELL') return {
            level: 'CLOSE_NOW',
            icon: '🔴',
            cls: 'text-red-300 bg-red-900/40 border-red-600/50',
            headline: 'เทรนกลับทิศชัดเจน ควรปิดทันที',
            detail: pnlNow > 0 ? `ล็อคกำไร ${pnlStr} (${rStr}) ก่อน SL โดนชน` : `P&L ${pnlStr} — ตัดขาดทุนก่อนขยายตัว`,
        };
        if (!isBuy && curSig === 'BUY') return {
            level: 'CLOSE_NOW',
            icon: '🔴',
            cls: 'text-red-300 bg-red-900/40 border-red-600/50',
            headline: 'เทรนกลับทิศชัดเจน ควรปิดทันที',
            detail: pnlNow > 0 ? `ล็อคกำไร ${pnlStr} (${rStr}) ก่อน SL โดนชน` : `P&L ${pnlStr} — ตัดขาดทุนก่อนขยายตัว`,
        };

        // 2 — หลายตัวชี้วัด overbought/oversold พร้อมกัน
        if (isBuy) {
            let cnt = 0;
            const hits = [];
            if (rsi    >  72) { cnt++; hits.push(`RSI ${rsi.toFixed(0)}`); }
            if (stochK >  80) { cnt++; hits.push(`Stoch ${stochK.toFixed(0)}`); }
            if (willR  > -15) { cnt++; hits.push(`W%R ${willR.toFixed(0)}`); }
            if (cnt >= 2 && pnlNow > 0) return {
                level: 'CONSIDER_CLOSE',
                icon: '🟡',
                cls: 'text-yellow-300 bg-yellow-900/30 border-yellow-700/40',
                headline: 'ตัวชี้วัดหลายตัวบอก "แรงหมดแล้ว"',
                detail: `Overbought ${cnt}/3 (${hits.join(', ')}) — กำไร ${pnlStr} (${rStr}) อาจย้อนก่อน TP`,
            };
        } else {
            let cnt = 0;
            const hits = [];
            if (rsi    <  28) { cnt++; hits.push(`RSI ${rsi.toFixed(0)}`); }
            if (stochK <  20) { cnt++; hits.push(`Stoch ${stochK.toFixed(0)}`); }
            if (willR  < -85) { cnt++; hits.push(`W%R ${willR.toFixed(0)}`); }
            if (cnt >= 2 && pnlNow > 0) return {
                level: 'CONSIDER_CLOSE',
                icon: '🟡',
                cls: 'text-yellow-300 bg-yellow-900/30 border-yellow-700/40',
                headline: 'ตัวชี้วัดหลายตัวบอก "แรงหมดแล้ว"',
                detail: `Oversold ${cnt}/3 (${hits.join(', ')}) — กำไร ${pnlStr} (${rStr}) อาจดีดก่อน TP`,
            };
        }

        // 3 — สัญญาณเปลี่ยนเป็น WAIT + มีกำไรพอควร
        if (curSig === 'WAIT' && pnlNow >= 5) return {
            level: 'TAKE_PROFIT',
            icon: '🟠',
            cls: 'text-orange-300 bg-orange-900/30 border-orange-700/40',
            headline: 'โมเมนตัมเริ่มอ่อน พิจารณาล็อคกำไร',
            detail: `สัญญาณเปลี่ยนเป็น WAIT — กำไรปัจจุบัน ${pnlStr} (${rStr})`,
        };

        // 4 — Score ของฝ่ายตรงข้ามสูงขึ้นชัดเจน
        const scoreDiff = isBuy ? (bull - bear) : (bear - bull);
        if (scoreDiff < -4 && pnlNow > 0) return {
            level: 'TAKE_PROFIT',
            icon: '🟠',
            cls: 'text-orange-300 bg-orange-900/30 border-orange-700/40',
            headline: 'โมเมนตัมเริ่มอ่อน พิจารณาล็อคกำไร',
            detail: `Score ต้านทานสูงขึ้น (${isBuy?'Bull':'Bear'} ${isBuy?bull:bear} vs ${isBuy?bear:bull}) — กำไร ${pnlStr} (${rStr})`,
        };

        // ✅ เทรนยังดี ถือต่อ
        return {
            level: 'HOLD',
            icon: '✅',
            cls: 'text-green-300 bg-green-900/20 border-green-800/30',
            headline: 'เทรนยังดี ถือต่อได้ตามแผน',
            detail: `P&L ปัจจุบัน ${pnlStr} (${rStr})`,
        };
    };

    // ── Sustained / Long Trend Detector ────────────────────────────────────
    const calcSustainedTrend = (aiAnalysis, basicAnalysis, h4Analysis, price) => {
        if (!aiAnalysis || !basicAnalysis || !price) return null;
        const sig = aiAnalysis.signal;
        if (sig !== 'BUY' && sig !== 'SELL') return null;

        const isBuy     = sig === 'BUY';
        const bull      = aiAnalysis.bullScore    ?? 0;
        const bear      = aiAnalysis.bearScore    ?? 0;
        const scoreDiff = isBuy ? bull - bear : bear - bull;
        const adx       = basicAnalysis.adx;
        const rsi       = (typeof basicAnalysis?.rsi === 'number' ? basicAnalysis.rsi : basicAnalysis?.rsi?.value) ?? 50;
        const ema20     = basicAnalysis.ema20          ?? price;
        const ema200    = basicAnalysis.ema200         ?? price;
        const macdHist  = basicAnalysis.macd?.histogram ?? 0;
        const stochK    = basicAnalysis.stoch?.k        ?? 50;
        const willR     = basicAnalysis.williamsR?.value ?? -50;
        const daily     = h4Analysis?.daily ?? null;
        const h4raw     = h4Analysis?.h4    ?? null;
        const h4Trend   = h4raw?.trend ?? (h4Analysis?.trend === 'UP' ? 'BULL' : h4Analysis?.trend === 'DOWN' ? 'BEAR' : 'NEUTRAL');
        const dailyTrend = daily?.trend ?? 'NEUTRAL';

        let score = 0;
        const reasons = [];

        // 1 ── H1 ADX
        if (adx?.strong) {
            score += 3;
            reasons.push(`📊 ADX H1 ${adx.adx} แข็งแกร่ง (>30) — มีทิศทางชัดเจน`);
        } else if (adx?.trending) {
            score += 1;
            reasons.push(`📊 ADX H1 ${adx.adx} — ตลาดมีทิศทาง`);
        }

        // 2 ── Daily ADX
        if (daily?.adx?.strong) {
            score += 3;
            reasons.push(`📅 ADX Daily ${daily.adx.adx} แข็งแกร่ง — เทรนยาวชัดเจน`);
        } else if (daily?.adx?.trending) {
            score += 2;
            reasons.push(`📅 ADX Daily ${daily.adx.adx} — เทรนยาวมีทิศทาง`);
        }

        // 3 ── All TF aligned
        const dailyOk = isBuy ? dailyTrend==='BULL' : dailyTrend==='BEAR';
        const h4Ok    = isBuy ? (h4Trend==='BULL'||h4Trend==='UP') : (h4Trend==='BEAR'||h4Trend==='DOWN');
        if (dailyOk && h4Ok) {
            score += 4;
            reasons.push('🕐 Daily + H4 + H1 Aligned — เทรนเดียวกันทุก Timeframe');
        } else if (dailyOk) {
            score += 2;
            reasons.push('📅 Daily Trend สอดคล้องกับสัญญาณ');
        } else if (h4Ok) {
            score += 2;
            reasons.push('⏱️ H4 Trend สอดคล้องกับสัญญาณ');
        }

        // 4 ── Score gap
        if (scoreDiff >= 15) {
            score += 3;
            reasons.push(`⚡ Score ${isBuy?'Bull':'Bear'} นำห่างมาก +${scoreDiff} คะแนน`);
        } else if (scoreDiff >= 10) {
            score += 2;
            reasons.push(`⚡ Score ${isBuy?'Bull':'Bear'} นำ +${scoreDiff} คะแนน`);
        } else if (scoreDiff >= 6) {
            score += 1;
        }

        // 5 ── RSI อยู่ใน trending zone (ไม่ overbought/oversold)
        if (isBuy && rsi >= 50 && rsi <= 70) {
            score += 2;
            reasons.push(`📈 RSI ${rsi.toFixed(0)} อยู่ใน Bull Zone — ยังมีแรงขึ้นต่อ`);
        } else if (!isBuy && rsi >= 30 && rsi <= 50) {
            score += 2;
            reasons.push(`📉 RSI ${rsi.toFixed(0)} อยู่ใน Bear Zone — ยังมีแรงลงต่อ`);
        }

        // 6 ── EMA alignment (ema20 > ema200 for bull, < for bear)
        if (isBuy && ema20 > ema200 && price > ema200) {
            const dist = ((price - ema200) / ema200 * 100).toFixed(1);
            score += 2;
            reasons.push(`📐 ราคาและ EMA20 เหนือ EMA200 +${dist}% — โครงสร้างขาขึ้น`);
        } else if (!isBuy && ema20 < ema200 && price < ema200) {
            const dist = ((ema200 - price) / ema200 * 100).toFixed(1);
            score += 2;
            reasons.push(`📐 ราคาและ EMA20 ต่ำกว่า EMA200 -${dist}% — โครงสร้างขาลง`);
        }

        // 7 ── MACD histogram ขยายตัว
        if (isBuy && macdHist > 0) {
            score += 1;
            reasons.push('📊 MACD Histogram บวก — Momentum ขาขึ้น');
        } else if (!isBuy && macdHist < 0) {
            score += 1;
            reasons.push('📊 MACD Histogram ลบ — Momentum ขาลง');
        }

        // 8 ── Stoch + W%R ไม่ Overbought (ยังมีที่วิ่ง)
        if (isBuy && stochK < 80 && willR < -20) {
            score += 1;
            reasons.push('💡 Stoch & W%R ยังไม่ Overbought — มีที่วิ่งขึ้นต่อ');
        } else if (!isBuy && stochK > 20 && willR > -80) {
            score += 1;
            reasons.push('💡 Stoch & W%R ยังไม่ Oversold — มีที่วิ่งลงต่อ');
        }

        // 9 ── Confidence bonus
        if (aiAnalysis.confidence >= 90) score += 2;
        else if (aiAnalysis.confidence >= 80) score += 1;

        // 10 ── Dow Theory alignment (from runTechnicalAnalysis result)
        const dowT = aiAnalysis?.dowTrend;
        if (dowT) {
            if (isBuy && dowT.trend === 'UP') {
                score += 3;
                reasons.push(`📐 Dow Theory Uptrend (HH+HL) ยืนยัน — โครงสร้างราคาขาขึ้น`);
            } else if (!isBuy && dowT.trend === 'DOWN') {
                score += 3;
                reasons.push(`📐 Dow Theory Downtrend (LH+LL) ยืนยัน — โครงสร้างราคาขาลง`);
            } else if (dowT.trendChange) {
                score -= 2; // trend changing → reduce confidence in sustained
                reasons.push(`⚠️ Dow Theory: ${dowT.label} — อาจเปลี่ยนทิศ ระวัง!`);
            }
        }

        // 11 ── Fresh D&S Zone support/resistance
        const ds = aiAnalysis?.dsZones;
        if (ds) {
            const zoneIn = isBuy
                ? ds.demandZones.find(z => (z.inZone || z.nearZone) && z.freshness === 'FRESH')
                : ds.supplyZones.find(z => (z.inZone || z.nearZone) && z.freshness === 'FRESH');
            if (zoneIn) {
                score += 3;
                reasons.push(`🎯 Fresh ${isBuy?'Demand':'Supply'} Zone (${zoneIn.pattern}) — ยืนยัน Institutional Level`);
            }
        }

        if (score < 8) return null;  // ธรรมดา ไม่แสดง

        const strength = score >= 16 ? 'VERY_STRONG' : score >= 12 ? 'STRONG' : 'MODERATE';
        const labels = {
            VERY_STRONG: { th: 'มั่นใจสูงมาก เทรนยาวแข็งแกร่ง',   emoji: isBuy ? '🚀' : '🔻' },
            STRONG:      { th: 'เทรนยาวน่าเชื่อถือ',               emoji: isBuy ? '📈' : '📉' },
            MODERATE:    { th: 'เทรนยาวกำลังพัฒนา',                emoji: isBuy ? '↗️' : '↘️' },
        };
        return { isBuy, score, strength, label: labels[strength], reasons: reasons.slice(0, 6) };
    };

    const GOLD_CRITICAL_KEYWORDS = ['nfp','non-farm','fomc','federal reserve','fed rate','interest rate','cpi','inflation','ppi','gdp','jackson hole','powell','yellen','payroll','employment change'];

    const isGoldCriticalEvent = (name = '') => {
        const n = name.toLowerCase();
        return GOLD_CRITICAL_KEYWORDS.some(k => n.includes(k));
    };

    const getHighImpactNewsRisk = (now = new Date()) => {
        let events = [];
        try {
            const saved = localStorage.getItem('goldHighImpactNewsUtc');
            const parsed = saved ? JSON.parse(saved) : null;
            if (Array.isArray(parsed)) events = parsed;
        } catch(e) {}
        const parsed = events
            .map(ev => ({ ...ev, timeMs: Date.parse(ev.timeUtc || ev.date || ev.time || '') }))
            .filter(ev => Number.isFinite(ev.timeMs) && ev.timeMs > 0);

        // หาข่าวที่ใกล้เคียงที่สุด (บน window ที่กว้างที่สุด)
        const active = parsed.find(ev => {
            const diffMin = (now.getTime() - ev.timeMs) / 60000; // บวก = ผ่านแล้ว
            const isCrit  = isGoldCriticalEvent(ev.name || ev.title || '');
            const preBuf  = isCrit ? -60 : -30;   // ก่อนข่าว
            const postBuf = isCrit ? 45  : 15;    // หลังข่าว
            return diffMin >= preBuf && diffMin <= postBuf;
        });

        if (active) {
            const name = active.name || active.title || 'High-impact news';
            const isCrit = isGoldCriticalEvent(name);
            const minutesToEvent = Math.round((active.timeMs - now.getTime()) / 60000);
            return { active: true, name, timeUtc: new Date(active.timeMs).toISOString(), isGoldCritical: isCrit, minutesToEvent };
        }
        return { active: false, name: '', timeUtc: '', isGoldCritical: false, minutesToEvent: 999 };
    };

    // ดึงข่าวที่จะเกิดขึ้นในอนาคต (สำหรับ UI countdown)
    const getUpcomingNews = (events = [], now = new Date(), count = 5) => {
        let list = [];
        try {
            if (!events.length) {
                const saved = localStorage.getItem('goldHighImpactNewsUtc');
                const p = saved ? JSON.parse(saved) : null;
                if (Array.isArray(p)) list = p;
            } else list = events;
        } catch(e) {}
        return list
            .map(ev => {
                const timeMs = Date.parse(ev.timeUtc || ev.date || ev.time || '');
                return { ...ev, timeMs, name: ev.name || ev.title || 'Unknown', country: ev.country || 'USD' };
            })
            .filter(ev => Number.isFinite(ev.timeMs) && ev.timeMs > now.getTime() - 30 * 60 * 1000)
            .sort((a, b) => a.timeMs - b.timeMs)
            .slice(0, count);
    };

    // ═══════════════════════════════════════════════════════
    //  CANDLESTICK PATTERN DETECTION
    // ═══════════════════════════════════════════════════════
    const detectCandlePatterns = (candles) => {
        const patterns = [];
        const n = candles.length;
        if (n < 3) return patterns;
        const [,o2,h2,l2,c2] = candles[n-3];
        const [,o1,h1,l1,c1] = candles[n-2];
        const [,o0,h0,l0,c0] = candles[n-1];
        const body0 = Math.abs(c0-o0), body1 = Math.abs(c1-o1), body2 = Math.abs(c2-o2);
        const range0 = h0-l0, range1 = h1-l1;
        const lowerShadow0 = Math.min(o0,c0) - l0;
        const upperShadow0 = h0 - Math.max(o0,c0);

        // Bullish Engulfing
        if (c1 < o1 && c0 > o0 && c0 >= o1 && o0 <= c1 && body0 > body1)
            patterns.push({ name: 'Bullish Engulfing', bias: 'bull', score: 3, desc: 'แท่งขึ้นกลืนแท่งลง → สัญญาณกลับตัวขึ้น' });
        // Bearish Engulfing
        if (c1 > o1 && c0 < o0 && c0 <= o1 && o0 >= c1 && body0 > body1)
            patterns.push({ name: 'Bearish Engulfing', bias: 'bear', score: 3, desc: 'แท่งลงกลืนแท่งขึ้น → สัญญาณกลับตัวลง' });
        // Hammer
        if (c1 < o1 && lowerShadow0 > body0 * 2 && upperShadow0 < body0 * 0.5 && range0 > 0)
            patterns.push({ name: 'Hammer', bias: 'bull', score: 2, desc: 'ค้อน → แนวรับแข็งแกร่ง สัญญาณขึ้น' });
        // Shooting Star
        if (c1 > o1 && upperShadow0 > body0 * 2 && lowerShadow0 < body0 * 0.5 && range0 > 0)
            patterns.push({ name: 'Shooting Star', bias: 'bear', score: 2, desc: 'ดาวตก → แนวต้านแข็งแกร่ง สัญญาณลง' });
        // Doji
        if (range0 > 0 && body0 < range0 * 0.1)
            patterns.push({ name: 'Doji', bias: 'neutral', score: 1, desc: 'แท่งดอจิ → ตลาดลังเล รอสัญญาณยืนยัน' });
        // Morning Star (bullish reversal)
        if (c2 < o2 && body1 < body2 * 0.3 && c0 > o0 && c0 > (o2 + c2) / 2)
            patterns.push({ name: 'Morning Star', bias: 'bull', score: 4, desc: 'ดาวเช้า → Reversal ขาขึ้น สัญญาณแรงมาก' });
        // Evening Star (bearish reversal)
        if (c2 > o2 && body1 < body2 * 0.3 && c0 < o0 && c0 < (o2 + c2) / 2)
            patterns.push({ name: 'Evening Star', bias: 'bear', score: 4, desc: 'ดาวเย็น → Reversal ขาลง สัญญาณแรงมาก' });
        // Bullish Marubozu
        if (range0 > 0 && body0 > range0 * 0.85 && c0 > o0)
            patterns.push({ name: 'Bullish Marubozu', bias: 'bull', score: 2, desc: 'แท่งขึ้นแข็งแกร่ง ไม่มีเงา' });
        // Bearish Marubozu
        if (range0 > 0 && body0 > range0 * 0.85 && c0 < o0)
            patterns.push({ name: 'Bearish Marubozu', bias: 'bear', score: 2, desc: 'แท่งลงแข็งแกร่ง ไม่มีเงา' });
        // Tweezer Bottom
        if (Math.abs(l0 - l1) < range0 * 0.08 && c1 < o1 && c0 > o0)
            patterns.push({ name: 'Tweezer Bottom', bias: 'bull', score: 2, desc: 'ก้นแฝด → แนวรับแข็งแกร่ง' });
        // Tweezer Top
        if (Math.abs(h0 - h1) < range0 * 0.08 && c1 > o1 && c0 < o0)
            patterns.push({ name: 'Tweezer Top', bias: 'bear', score: 2, desc: 'ยอดแฝด → แนวต้านแข็งแกร่ง' });
        // Three White Soldiers
        if (c0 > o0 && c1 > o1 && c2 > o2 && c0 > c1 && c1 > c2 && o0 > o1 && o1 > o2)
            patterns.push({ name: 'Three White Soldiers', bias: 'bull', score: 3, desc: '3 แท่งขึ้นติดต่อกัน → momentum ขาขึ้นแรง' });
        // Three Black Crows
        if (c0 < o0 && c1 < o1 && c2 < o2 && c0 < c1 && c1 < c2 && o0 < o1 && o1 < o2)
            patterns.push({ name: 'Three Black Crows', bias: 'bear', score: 3, desc: '3 แท่งลงติดต่อกัน → momentum ขาลงแรง' });
        return patterns;
    };

    // ═══════════════════════════════════════════════════════
    //  CORE ANALYSIS ENGINE v4 (Professional Grade)
    // ═══════════════════════════════════════════════════════
    // หลักการมืออาชีพ:
    //   1. **MTF:** วิเคราะห์แนวโน้มใหญ่จาก H4 ก่อน
    //   2. ตรวจ Market Regime ด้วย ADX (Trending vs Ranging)
    //   3. Trending (ADX>22): เทรดตาม trend, เข้าที่ Pullback EMA
    //   4. Ranging (ADX<22):  Mean Reversion, เข้าที่ extreme zones
    //   5. ต้องมี ≥3 indicator types เห็นตรงกัน (Confluence)
    //   6. TP/SL ตาม Swing High/Low + ATR buffer
    const runTechnicalAnalysis = (candles, currentPrice, analysis, h4Analysis) => {
        const rules = [];
        let bullScore = 0, bearScore = 0;

        const { rsi, sma50, ema20, ema50, ema200, macd, bb, atr, stoch, williamsR, fib, sessions, adx, swings, pivots, dxy } = analysis;

        // ── Demand & Supply Zone Analysis ────────────────────
        const dsZones  = calcDemandSupplyZones(candles, currentPrice, atr || 10);
        const dowTrend = calcDowTheorySwings(candles, 50);
        const wr = williamsR ?? { value:-50, prev:-50, overbought:false, oversold:false, zone:'neutral' };
        const adxVal  = adx?.adx  ?? 20;
        const pdi     = adx?.pdi  ?? 20;
        const mdi     = adx?.mdi  ?? 20;
        const executionBuffer = Math.max(0.6, atr * 0.05); // spread/slippage/commission buffer for XAUUSD
        const newsRisk = getHighImpactNewsRisk();

        // ══ MARKET REGIME ══════════════════════════════════
        // ADX > 25 = Trending แรง, 22-25 = Trending อ่อน, <22 = Ranging/Choppy
        const isTrending   = adxVal > 22;
        const isStrongTrend= adxVal > 28;
        const isRanging    = adxVal <= 22;
        const regime       = isStrongTrend ? 'STRONG_TREND' : isTrending ? 'TREND' : 'RANGE';

        // ══ MTF CONTEXT (Daily + H4) ══════════════════════
        // Daily = Macro Bias (สำคัญที่สุด)
        // H4    = Setup Confirmation
        // H1    = Entry Timing (current timeframe)
        const daily  = h4Analysis?.daily  ?? null;
        const h4     = h4Analysis?.h4     ?? null;
        // backward-compat: ถ้าเป็น object เก่า {trend,ema20} ก็ยังใช้ได้
        const legacyH4Trend = h4Analysis?.trend ?? 'NEUTRAL';

        const dailyTrend = daily?.trend ?? 'NEUTRAL';
        const h4Trend    = h4?.trend    ?? legacyH4Trend;

        // ── Daily Macro Bias ─────────────────────────────
        if (dailyTrend === 'BULL') {
            bullScore += 7;
            rules.push({ text: `🌍 Daily Trend: BULL (EMA20>${daily?.ema20} > EMA50${daily?.ema50}) — Macro Bias ขาขึ้น`, bias:'bull', score:7 });
            // Bonus: Daily RSI healthy (not overbought)
            if (daily?.rsi && daily.rsi > 45 && daily.rsi < 70) {
                bullScore += 2;
                rules.push({ text: `Daily RSI ${daily.rsi} Healthy Zone — Uptrend แข็งแรง`, bias:'bull', score:2 });
            }
            // Daily ADX confirming trend
            if (daily?.adx?.trending) {
                bullScore += 2;
                rules.push({ text: `Daily ADX ${daily.adx.adx} — Trend ยาวแข็งแกร่ง`, bias:'bull', score:2 });
            }
        } else if (dailyTrend === 'BEAR') {
            bearScore += 7;
            rules.push({ text: `🌍 Daily Trend: BEAR (EMA20<EMA50) — Macro Bias ขาลง`, bias:'bear', score:7 });
            if (daily?.rsi && daily.rsi < 55 && daily.rsi > 30) {
                bearScore += 2;
                rules.push({ text: `Daily RSI ${daily.rsi} Healthy Zone — Downtrend แข็งแรง`, bias:'bear', score:2 });
            }
            if (daily?.adx?.trending) {
                bearScore += 2;
                rules.push({ text: `Daily ADX ${daily.adx.adx} — Trend ยาวแข็งแกร่ง`, bias:'bear', score:2 });
            }
        } else {
            rules.push({ text: `🌍 Daily Trend: NEUTRAL — Macro Bias ยังไม่ชัดเจน`, bias:'neutral', score:0 });
        }

        // ── H4 Setup Confirmation ────────────────────────
        if (h4Trend === 'UP') {
            bullScore += 5;
            rules.push({ text: `📈 H4 Trend: UP (EMA20:${h4?.ema20 ?? h4Analysis?.ema20}) — Setup ขาขึ้นยืนยัน`, bias:'bull', score:5 });
            if (h4?.rsi && h4.rsi > 45 && h4.rsi < 70) {
                bullScore += 1;
                rules.push({ text: `H4 RSI ${h4.rsi} — Momentum ขาขึ้นยังดี`, bias:'bull', score:1 });
            }
            if (h4?.macd?.trend === 'bullish' || h4?.macd?.trend === 'weak_bullish') {
                bullScore += 2;
                rules.push({ text: `H4 MACD Bullish — ยืนยัน Setup ซื้อ`, bias:'bull', score:2 });
            }
        } else if (h4Trend === 'DOWN') {
            bearScore += 5;
            rules.push({ text: `📉 H4 Trend: DOWN (EMA20:${h4?.ema20 ?? h4Analysis?.ema20}) — Setup ขาลงยืนยัน`, bias:'bear', score:5 });
            if (h4?.rsi && h4.rsi < 55 && h4.rsi > 30) {
                bearScore += 1;
                rules.push({ text: `H4 RSI ${h4.rsi} — Momentum ขาลงยังดี`, bias:'bear', score:1 });
            }
            if (h4?.macd?.trend === 'bearish' || h4?.macd?.trend === 'weak_bearish') {
                bearScore += 2;
                rules.push({ text: `H4 MACD Bearish — ยืนยัน Setup ขาย`, bias:'bear', score:2 });
            }
        } else {
            rules.push({ text: `↔️ H4 Trend: SIDEWAYS — Setup ยังไม่ชัดเจน`, bias:'neutral', score:0 });
        }

        // ── MTF Alignment Score ──────────────────────────
        // 3/3 timeframes align = max bonus, conflict = penalty
        const dailyBull = dailyTrend === 'BULL';
        const dailyBear = dailyTrend === 'BEAR';
        const h4Bull    = h4Trend === 'UP';
        const h4Bear    = h4Trend === 'DOWN';

        // Perfect 3TF alignment: Daily + H4 + H1 all agree
        if (dailyBull && h4Bull && isBullTrend) {
            bullScore += 4;
            rules.push({ text: `🎯 Perfect MTF Alignment: Daily✅ H4✅ H1✅ ขาขึ้นทุก Timeframe`, bias:'bull', score:4 });
        } else if (dailyBear && h4Bear && isBearTrend) {
            bearScore += 4;
            rules.push({ text: `🎯 Perfect MTF Alignment: Daily✅ H4✅ H1✅ ขาลงทุก Timeframe`, bias:'bear', score:4 });
        }


        rules.push({ text: `📊 Regime: ${regime} (ADX:${adxVal}) | +DI:${pdi} -DI:${mdi}`, bias:'neutral', score:0 });

        // ══ DXY CORRELATION FILTER ══════════════════════════
        // DXY ผกผันกับทอง ~-0.75 to -0.90 | DXY ขึ้น = กดทอง | DXY ลง = หนุนทอง
        if (dxy && dxy.signal !== 'NEUTRAL' && dxy.lastUpdate) {
            const ageMin = (Date.now() - new Date(dxy.lastUpdate).getTime()) / 60000;
            if (ageMin < 30) { // ใช้ข้อมูลที่ไม่เกิน 30 นาที
                const momStr = dxy.momentum > 0 ? `+${dxy.momentum}%` : `${dxy.momentum}%`;
                if (dxy.signal === 'BULLISH_GOLD') {
                    const pts = dxy.strength === 'STRONG' ? 5 : 3;
                    bullScore += pts;
                    rules.push({ text: `💵 DXY ${dxy.trend} (${momStr}) → หนุนทองขึ้น [${dxy.strength}]`, bias:'bull', score:pts });
                } else if (dxy.signal === 'BEARISH_GOLD') {
                    const pts = dxy.strength === 'STRONG' ? 5 : 3;
                    bearScore += pts;
                    rules.push({ text: `💵 DXY ${dxy.trend} (${momStr}) → กดดันทองลง [${dxy.strength}]`, bias:'bear', score:pts });
                    // Strong DXY conflict: ถ้า DXY แข็งมากแต่ engine อยากซื้อทอง → ลดพลัง BUY
                    if (dxy.strength === 'STRONG' && bullScore > bearScore) {
                        const pen = Math.round(bullScore * 0.25);
                        bullScore = Math.max(0, bullScore - pen);
                        rules.push({ text: `⚠️ DXY แข็งแกร่งมาก — ลด BUY Power (-${pen}pt)`, bias:'neutral', score:0 });
                    }
                }
            }
        }

        // ══ SESSION ════════════════════════════════════════
        const isHighLiq = sessions.some(s => s.color === 'red' || s.color === 'yellow');
        const isLondon  = sessions.some(s => s.color === 'green');
        const isAsian   = sessions.some(s => s.color === 'blue');
        // Asian session = ลด score เพราะ gold ผันผวนน้อยกว่า London/NY

        // ══ EMA TREND STRUCTURE ════════════════════════════
        const isBullTrend  = ema20 > 0 && ema200 > 0 && ema20 > ema200;
        const isBearTrend  = ema20 > 0 && ema200 > 0 && ema20 < ema200;
        const pAboveEMA20  = currentPrice > ema20;
        const pBelowEMA20  = currentPrice < ema20;
        const pAboveSMA50  = currentPrice > sma50;
        const pBelowSMA50  = currentPrice < sma50;
        const pAboveEMA200 = currentPrice > ema200;
        const pBelowEMA200 = currentPrice < ema200;

        // ══ PULLBACK TO EMA DETECTION ══════════════════════
        // ราคา Pullback มาใกล้ EMA20 ใน trend ที่ดี
        const nearEMA20 = ema20 > 0 && Math.abs(currentPrice - ema20) < atr * 0.6;
        const nearSMA50 = sma50 > 0 && Math.abs(currentPrice - sma50) < atr * 0.8;

        // ══════════════════════════════════════════════════
        //  TRENDING REGIME RULES
        // ══════════════════════════════════════════════════
        if (isTrending) {

            // ─ Bull Trend Confirmation ─────────────────────
            if (isBullTrend) {
                // EMA alignment strong
                if (pAboveEMA20 && pAboveSMA50 && pAboveEMA200) {
                    bullScore += 5;
                    rules.push({ text: `✅ Bull Trend: ราคา > EMA20 > SMA50 > EMA200 (แนวโน้มแข็งแกร่ง)`, bias:'bull', score:5 });
                } else if (pAboveEMA200) {
                    bullScore += 3;
                    rules.push({ text: `↗ Bull Trend: ราคาเหนือ EMA200 (Pullback ระยะกลาง)`, bias:'bull', score:3 });
                }
                // Pullback to EMA → Entry opportunity
                if (nearEMA20 && pAboveEMA200) {
                    bullScore += 4;
                    rules.push({ text: `🎯 Pullback ถึง EMA20 (${ema20}) ใน Uptrend — โอกาสเข้า BUY`, bias:'bull', score:4 });
                } else if (nearSMA50 && pAboveEMA200) {
                    bullScore += 3;
                    rules.push({ text: `🎯 Pullback ถึง SMA50 (${sma50}) ใน Uptrend — โอกาสเข้า BUY`, bias:'bull', score:3 });
                }
                // ADX+DI confirmation
                if (pdi > mdi && isStrongTrend) {
                    bullScore += 3;
                    rules.push({ text: `💪 ADX:${adxVal} แรงมาก, +DI(${pdi}) > -DI(${mdi}) — Trend ขาขึ้นยืนยัน`, bias:'bull', score:3 });
                } else if (pdi > mdi) {
                    bullScore += 2;
                    rules.push({ text: `ADX:${adxVal}, +DI(${pdi}) > -DI(${mdi}) — Trend ขาขึ้น`, bias:'bull', score:2 });
                }
            }

            // ─ Bear Trend Confirmation ─────────────────────
            if (isBearTrend) {
                if (pBelowEMA20 && pBelowSMA50 && pBelowEMA200) {
                    bearScore += 5;
                    rules.push({ text: `✅ Bear Trend: ราคา < EMA20 < SMA50 < EMA200 (แนวโน้มแข็งแกร่ง)`, bias:'bear', score:5 });
                } else if (pBelowEMA200) {
                    bearScore += 3;
                    rules.push({ text: `↘ Bear Trend: ราคาต่ำกว่า EMA200 (Pullback ระยะกลาง)`, bias:'bear', score:3 });
                }
                if (nearEMA20 && pBelowEMA200) {
                    bearScore += 4;
                    rules.push({ text: `🎯 Pullback ถึง EMA20 (${ema20}) ใน Downtrend — โอกาสเข้า SELL`, bias:'bear', score:4 });
                } else if (nearSMA50 && pBelowEMA200) {
                    bearScore += 3;
                    rules.push({ text: `🎯 Pullback ถึง SMA50 (${sma50}) ใน Downtrend — โอกาสเข้า SELL`, bias:'bear', score:3 });
                }
                if (mdi > pdi && isStrongTrend) {
                    bearScore += 3;
                    rules.push({ text: `💪 ADX:${adxVal} แรงมาก, -DI(${mdi}) > +DI(${pdi}) — Trend ขาลงยืนยัน`, bias:'bear', score:3 });
                } else if (mdi > pdi) {
                    bearScore += 2;
                    rules.push({ text: `ADX:${adxVal}, -DI(${mdi}) > +DI(${pdi}) — Trend ขาลง`, bias:'bear', score:2 });
                }
            }

            // ─ MACD Momentum (in trend context) ───────────
            if (macd.trend === 'bullish') {
                bullScore += 4;
                rules.push({ text: `📈 MACD Bullish Cross + Histogram บวก (momentum ยืนยัน)`, bias:'bull', score:4 });
            } else if (macd.trend === 'weak_bullish' && isBullTrend) {
                bullScore += 2;
                rules.push({ text: `MACD เหนือ Signal ใน Uptrend`, bias:'bull', score:2 });
            }
            if (macd.trend === 'bearish') {
                bearScore += 4;
                rules.push({ text: `📉 MACD Bearish Cross + Histogram ลบ (momentum ยืนยัน)`, bias:'bear', score:4 });
            } else if (macd.trend === 'weak_bearish' && isBearTrend) {
                bearScore += 2;
                rules.push({ text: `MACD ใต้ Signal ใน Downtrend`, bias:'bear', score:2 });
            }
            // Histogram accelerating
            if (macd.histogram > 0 && macd.prevHistogram >= 0 && macd.histogram > macd.prevHistogram * 1.1) {
                bullScore += 2; rules.push({ text: `MACD Histogram เร่งขึ้น — Momentum กำลังแรงขึ้น`, bias:'bull', score:2 });
            }
            if (macd.histogram < 0 && macd.prevHistogram <= 0 && macd.histogram < macd.prevHistogram * 1.1) {
                bearScore += 2; rules.push({ text: `MACD Histogram เร่งลง — Momentum กำลังแรงขึ้น`, bias:'bear', score:2 });
            }

            // ─ RSI in trend context ────────────────────────
            // Trend: RSI pullback ลงมาก่อนแล้ว Bounce ขึ้น = entry ที่ดี
            if (isBullTrend && rsi > 45 && rsi < 65) {
                bullScore += 2; rules.push({ text: `RSI ${rsi} Healthy Zone ใน Uptrend (45-65) — Continuation Buy`, bias:'bull', score:2 });
            } else if (isBullTrend && rsi >= 35 && rsi <= 50) {
                bullScore += 3; rules.push({ text: `RSI ${rsi} Pullback Zone ใน Uptrend (35-50) — Bounce Entry`, bias:'bull', score:3 });
            } else if (rsi < 35) {
                bullScore += 4; rules.push({ text: `🔥 RSI ${rsi} Oversold (<35) — แรงขายอ่อนแอ`, bias:'bull', score:4 });
            }
            if (isBearTrend && rsi < 55 && rsi > 35) {
                bearScore += 2; rules.push({ text: `RSI ${rsi} Healthy Zone ใน Downtrend (35-55) — Continuation Sell`, bias:'bear', score:2 });
            } else if (isBearTrend && rsi >= 50 && rsi <= 65) {
                bearScore += 3; rules.push({ text: `RSI ${rsi} Pullback Zone ใน Downtrend (50-65) — Bounce Sell`, bias:'bear', score:3 });
            } else if (rsi > 65) {
                bearScore += 4; rules.push({ text: `🔥 RSI ${rsi} Overbought (>65) — แรงซื้ออ่อนแอ`, bias:'bear', score:4 });
            }

            // ─ Stochastic (trend confirmation) ────────────
            const stochCrossUp   = stoch.k > stoch.d && stoch.prevK <= stoch.prevD;
            const stochCrossDown = stoch.k < stoch.d && stoch.prevK >= stoch.prevD;
            if (stoch.k < 40 && stochCrossUp && isBullTrend) {
                bullScore += 4; rules.push({ text: `🔥 Stochastic Cross Up จาก Oversold Zone (K:${stoch.k}) ใน Uptrend`, bias:'bull', score:4 });
            } else if (stoch.k < 30) {
                bullScore += 3; rules.push({ text: `Stochastic Oversold (K:${stoch.k}) รอ Cross Up`, bias:'bull', score:3 });
            }
            if (stoch.k > 60 && stochCrossDown && isBearTrend) {
                bearScore += 4; rules.push({ text: `🔥 Stochastic Cross Down จาก Overbought Zone (K:${stoch.k}) ใน Downtrend`, bias:'bear', score:4 });
            } else if (stoch.k > 70) {
                bearScore += 3; rules.push({ text: `Stochastic Overbought (K:${stoch.k}) รอ Cross Down`, bias:'bear', score:3 });
            }

            // ─ Williams %R (Trending) ─────────────────────
            // ใน Trend: ใช้ Williams %R จับ Pullback entry
            if (wr.oversold && isBullTrend) {
                // Pullback ใน Uptrend → %R Oversold = Buy the dip
                const pts = wr.crossAbove50 ? 4 : 3;
                bullScore += pts;
                rules.push({ text: `📊 Williams %R ${wr.value} Oversold (< -80) ใน Uptrend — Pullback Entry`, bias:'bull', score:pts });
            } else if (wr.crossAbove50 && isBullTrend) {
                bullScore += 2;
                rules.push({ text: `📊 Williams %R ข้าม -50 ขึ้น (${wr.value}) — Bullish Momentum กลับมา`, bias:'bull', score:2 });
            }
            if (wr.overbought && isBearTrend) {
                const pts = wr.crossBelow50 ? 4 : 3;
                bearScore += pts;
                rules.push({ text: `📊 Williams %R ${wr.value} Overbought (> -20) ใน Downtrend — Pullback Entry`, bias:'bear', score:pts });
            } else if (wr.crossBelow50 && isBearTrend) {
                bearScore += 2;
                rules.push({ text: `📊 Williams %R ข้าม -50 ลง (${wr.value}) — Bearish Momentum กลับมา`, bias:'bear', score:2 });
            }

        // ══════════════════════════════════════════════════
        //  RANGING REGIME RULES (Mean Reversion)
        // ══════════════════════════════════════════════════
        } else {

            rules.push({ text: `↔️ Ranging Market — ใช้ Mean Reversion Strategy`, bias:'neutral', score:0 });

            // ─ RSI Extreme (ใน Range ต้องสุดขีด) ─────────
            if (rsi < 28)      { bullScore += 6; rules.push({ text: `🔥 RSI ${rsi} Extreme Oversold (<28) ใน Ranging`, bias:'bull', score:6 }); }
            else if (rsi < 38) { bullScore += 4; rules.push({ text: `RSI ${rsi} Oversold (<38) ใน Ranging`, bias:'bull', score:4 }); }
            else if (rsi > 72) { bearScore += 6; rules.push({ text: `🔥 RSI ${rsi} Extreme Overbought (>72) ใน Ranging`, bias:'bear', score:6 }); }
            else if (rsi > 62) { bearScore += 4; rules.push({ text: `RSI ${rsi} Overbought (>62) ใน Ranging`, bias:'bear', score:4 }); }

            // ─ Bollinger Bands (สำคัญมากใน Range) ─────────
            if (bb.pctB < 0)        { bullScore += 6; rules.push({ text: `🔥 ราคาทะลุต่ำกว่า BB Lower Band (pctB:${bb.pctB}%)`, bias:'bull', score:6 }); }
            else if (bb.pctB < 15)  { bullScore += 4; rules.push({ text: `ราคาแตะ BB Lower Band (pctB:${bb.pctB}%) — แนวรับ BB`, bias:'bull', score:4 }); }
            else if (bb.pctB < 25)  { bullScore += 2; rules.push({ text: `ราคาใกล้ BB Lower (pctB:${bb.pctB}%)`, bias:'bull', score:2 }); }
            if (bb.pctB > 100)      { bearScore += 6; rules.push({ text: `🔥 ราคาทะลุเหนือ BB Upper Band (pctB:${bb.pctB}%)`, bias:'bear', score:6 }); }
            else if (bb.pctB > 85)  { bearScore += 4; rules.push({ text: `ราคาแตะ BB Upper Band (pctB:${bb.pctB}%) — แนวต้าน BB`, bias:'bear', score:4 }); }
            else if (bb.pctB > 75)  { bearScore += 2; rules.push({ text: `ราคาใกล้ BB Upper (pctB:${bb.pctB}%)`, bias:'bear', score:2 }); }

            // ─ BB Squeeze Breakout ──────────────────────
            if (bb.squeeze) {
                const sq = bullScore >= bearScore ? 'bull' : 'bear';
                if (sq === 'bull') { bullScore += 3; rules.push({ text: `⚡ BB Squeeze! Breakout ขาขึ้นกำลังจะเกิด`, bias:'bull', score:3 }); }
                else               { bearScore += 3; rules.push({ text: `⚡ BB Squeeze! Breakout ขาลงกำลังจะเกิด`, bias:'bear', score:3 }); }
            }

            // ─ Stochastic (ใน Range ต้องรอ Cross) ─────────
            const stochCrossUp2   = stoch.k > stoch.d && stoch.prevK <= stoch.prevD;
            const stochCrossDown2 = stoch.k < stoch.d && stoch.prevK >= stoch.prevD;
            if (stoch.k < 20 && stochCrossUp2)   { bullScore += 5; rules.push({ text: `🔥 Stochastic Cross Up จาก Oversold (K:${stoch.k})`, bias:'bull', score:5 }); }
            else if (stoch.k < 20)               { bullScore += 3; rules.push({ text: `Stochastic Oversold (K:${stoch.k}) รอ Cross`, bias:'bull', score:3 }); }
            if (stoch.k > 80 && stochCrossDown2) { bearScore += 5; rules.push({ text: `🔥 Stochastic Cross Down จาก Overbought (K:${stoch.k})`, bias:'bear', score:5 }); }
            else if (stoch.k > 80)               { bearScore += 3; rules.push({ text: `Stochastic Overbought (K:${stoch.k}) รอ Cross`, bias:'bear', score:3 }); }

            // ─ Williams %R (Ranging — Mean Reversion) ────
            // ใน Range: %R Extreme = สัญญาณกลับตัวที่แนวรับ/แนวต้าน
            if (wr.oversold) {
                // ออกจาก Oversold (< -80) = เริ่มกลับขึ้น
                const exitOversold = wr.prev < -80 && wr.value > -80;
                const pts = exitOversold ? 6 : 4;
                bullScore += pts;
                rules.push({ text: `📊 Williams %R ${wr.value}${exitOversold ? ' ออกจาก Oversold ⚡' : ' Extreme Oversold'} — Mean Reversion Buy`, bias:'bull', score:pts });
            } else if (wr.crossAbove50) {
                bullScore += 2;
                rules.push({ text: `📊 Williams %R ข้าม -50 ขึ้น — Momentum เปลี่ยนทิศ Bull`, bias:'bull', score:2 });
            }
            if (wr.overbought) {
                const exitOverbought = wr.prev > -20 && wr.value < -20;
                const pts = exitOverbought ? 6 : 4;
                bearScore += pts;
                rules.push({ text: `📊 Williams %R ${wr.value}${exitOverbought ? ' ออกจาก Overbought ⚡' : ' Extreme Overbought'} — Mean Reversion Sell`, bias:'bear', score:pts });
            } else if (wr.crossBelow50) {
                bearScore += 2;
                rules.push({ text: `📊 Williams %R ข้าม -50 ลง — Momentum เปลี่ยนทิศ Bear`, bias:'bear', score:2 });
            }
            // Confluence: Williams %R + Stochastic ชี้ทิศเดียวกัน = bonus
            if ((wr.oversold && stoch.k < 25) || (wr.crossAbove50 && stoch.k > stoch.d && stoch.k < 50)) {
                bullScore += 2;
                rules.push({ text: `📊 Williams %R + Stochastic Oversold Confluence — สัญญาณซื้อแรงขึ้น`, bias:'bull', score:2 });
            }
            if ((wr.overbought && stoch.k > 75) || (wr.crossBelow50 && stoch.k < stoch.d && stoch.k > 50)) {
                bearScore += 2;
                rules.push({ text: `📊 Williams %R + Stochastic Overbought Confluence — สัญญาณขายแรงขึ้น`, bias:'bear', score:2 });
            }

            // ─ MACD ใน Range ────────────────────────────
            if (macd.trend === 'bullish')           { bullScore += 3; rules.push({ text: `MACD Bullish Cross ใน Ranging`, bias:'bull', score:3 }); }
            else if (macd.trend === 'weak_bullish') { bullScore += 1; rules.push({ text: `MACD เหนือ Signal ใน Ranging`, bias:'bull', score:1 }); }
            if (macd.trend === 'bearish')           { bearScore += 3; rules.push({ text: `MACD Bearish Cross ใน Ranging`, bias:'bear', score:3 }); }
            else if (macd.trend === 'weak_bearish') { bearScore += 1; rules.push({ text: `MACD ใต้ Signal ใน Ranging`, bias:'bear', score:1 }); }
        }

        // ══ FIBONACCI (ทั้ง 2 Regime) ══════════════════════
        if (fib) {
            const zone = atr * 0.55;
            const supports = [fib.r618, fib.r500, fib.r382, fib.r236, fib.low];
            const resists  = [fib.high, fib.r786, fib.r618, fib.r500];
            for (const lvl of supports) {
                if (lvl > 0 && currentPrice >= lvl && currentPrice - lvl < zone) {
                    const pts = isTrending ? 3 : 4; // ใน Ranging Fib สำคัญกว่า
                    bullScore += pts; rules.push({ text: `Fib Support ${lvl.toFixed(0)} (ATR zone ±${zone.toFixed(0)})`, bias:'bull', score:pts }); break;
                }
            }
            for (const lvl of resists) {
                if (lvl > 0 && currentPrice <= lvl && lvl - currentPrice < zone) {
                    const pts = isTrending ? 3 : 4;
                    bearScore += pts; rules.push({ text: `Fib Resistance ${lvl.toFixed(0)} (ATR zone ±${zone.toFixed(0)})`, bias:'bear', score:pts }); break;
                }
            }
        }

        // ══ SWING HIGH/LOW S/R ════════════════════════════
        if (swings) {
            const srZone = atr * 0.4;
            for (const sup of (swings.supports || [])) {
                if (currentPrice >= sup && currentPrice - sup < srZone) {
                    bullScore += 3; rules.push({ text: `📍 Swing Low Support ${sup} — Price Action แนวรับ`, bias:'bull', score:3 }); break;
                }
            }
            for (const res of (swings.resistances || [])) {
                if (currentPrice <= res && res - currentPrice < srZone) {
                    bearScore += 3; rules.push({ text: `📍 Swing High Resistance ${res} — Price Action แนวต้าน`, bias:'bear', score:3 }); break;
                }
            }
        }

        // ══ PIVOT POINTS (Daily Floor Pivot) ══════════════
        if (pivots) {
            const pvZone = atr * 0.35; // zone ±0.35 ATR รอบ pivot level
            const pvLevels = [
                { key:'r3', val: pivots.r3, type:'resist', pts: isTrending ? 2 : 3, label:'R3' },
                { key:'r2', val: pivots.r2, type:'resist', pts: isTrending ? 3 : 4, label:'R2' },
                { key:'r1', val: pivots.r1, type:'resist', pts: isTrending ? 3 : 4, label:'R1' },
                { key:'pp', val: pivots.pp, type:'both',   pts: 2,                  label:'PP' },
                { key:'s1', val: pivots.s1, type:'support',pts: isTrending ? 3 : 4, label:'S1' },
                { key:'s2', val: pivots.s2, type:'support',pts: isTrending ? 3 : 4, label:'S2' },
                { key:'s3', val: pivots.s3, type:'support',pts: isTrending ? 2 : 3, label:'S3' },
            ];
            for (const lv of pvLevels) {
                if (!lv.val || lv.val <= 0) continue;
                const dist = Math.abs(currentPrice - lv.val);
                if (dist > pvZone) continue;
                if (lv.type === 'support' || (lv.type === 'both' && currentPrice <= lv.val)) {
                    bullScore += lv.pts;
                    rules.push({ text: `🔵 Pivot ${lv.label} (${lv.val}) — แนวรับ Daily Pivot ราคาใกล้ (${dist.toFixed(1)})`, bias:'bull', score:lv.pts });
                } else if (lv.type === 'resist' || (lv.type === 'both' && currentPrice >= lv.val)) {
                    bearScore += lv.pts;
                    rules.push({ text: `🔵 Pivot ${lv.label} (${lv.val}) — แนวต้าน Daily Pivot ราคาใกล้ (${dist.toFixed(1)})`, bias:'bear', score:lv.pts });
                }
                break; // ใช้ level ที่ใกล้ที่สุดอย่างเดียว
            }
            // Bonus: ราคาอยู่เหนือ PP = bullish bias, ต่ำกว่า PP = bearish bias
            if (currentPrice > pivots.pp + pvZone * 0.5) {
                bullScore += 1;
                rules.push({ text: `🔵 ราคาเหนือ Pivot PP (${pivots.pp}) — Intraday Bullish Bias`, bias:'bull', score:1 });
            } else if (currentPrice < pivots.pp - pvZone * 0.5) {
                bearScore += 1;
                rules.push({ text: `🔵 ราคาต่ำกว่า Pivot PP (${pivots.pp}) — Intraday Bearish Bias`, bias:'bear', score:1 });
            }
        }

        // ══ CANDLESTICK PATTERNS (ทุก Regime) ════════════
        const patterns = detectCandlePatterns(candles);
        for (const p of patterns) {
            if (p.bias === 'bull') { bullScore += p.score; rules.push({ text: `🕯 ${p.name}: ${p.desc}`, bias:'bull', score:p.score }); }
            else if (p.bias === 'bear') { bearScore += p.score; rules.push({ text: `🕯 ${p.name}: ${p.desc}`, bias:'bear', score:p.score }); }
        }

        // ══ SESSION BONUS ══════════════════════════════════
        const sessBonus = isHighLiq ? 2 : isLondon ? 1 : isAsian ? 0 : -1;
        if (sessBonus > 0) {
            const tag = isHighLiq ? '⚡ NY+London Overlap' : 'London Session';
            if (bullScore > bearScore) { bullScore += sessBonus; rules.push({ text: `${tag} — สภาพคล่องสูง`, bias:'bull', score:sessBonus }); }
            else if (bearScore > bullScore) { bearScore += sessBonus; rules.push({ text: `${tag} — สภาพคล่องสูง`, bias:'bear', score:sessBonus }); }
        } else if (sessBonus < 0) {
            // Pre-market: หักคะแนนเล็กน้อย
            bullScore = Math.max(0, bullScore + sessBonus);
            bearScore = Math.max(0, bearScore + sessBonus);
            rules.push({ text: `⚠️ Pre-Market Session — สภาพคล่องต่ำ`, bias:'neutral', score:0 });
        }

        // ══ GOLD FIX TIMING BONUS ══════════════════════════
        // London Fix / COMEX Open = Institutional participation ↑ = momentum ↑
        const fixWin = getGoldFixWindows();
        let fixBonus = 0;
        if (fixWin.isActive) {
            const isLondonFix = fixWin.inAmFix || fixWin.inPmFix;
            const pts = isLondonFix ? 4 : fixWin.inComex ? 3 : 2;
            fixBonus = pts;
            if (bullScore > bearScore) {
                bullScore += pts;
                rules.push({ text: `🕐 ${fixWin.active} — Institutional Volume Window (+${pts}pt BUY Momentum)`, bias:'bull', score:pts });
            } else if (bearScore > bullScore) {
                bearScore += pts;
                rules.push({ text: `🕐 ${fixWin.active} — Institutional Volume Window (+${pts}pt SELL Momentum)`, bias:'bear', score:pts });
            } else {
                rules.push({ text: `🕐 ${fixWin.active} — Institutional Volume Window (รอทิศทางชัดขึ้น)`, bias:'neutral', score:0 });
            }
        } else if (fixWin.upcoming.length > 0) {
            const next = fixWin.upcoming[0];
            if (next.minsTo <= 30) {
                rules.push({ text: `⏱️ ${next.name} ใน ${next.minsTo} นาที (${next.bkkTime} BKK) — เตรียมรับ Volume เพิ่ม`, bias:'neutral', score:0 });
            }
        }

        // ══ COUNTER-TREND SAFETY NET ══════════════════════
        // ใน Strong Trend ห้าม Counter-Trend อย่างเด็ดขาด
        if (isStrongTrend && isBullTrend && bearScore > bullScore) {
            const penalty = Math.min(bearScore - bullScore, 6);
            bearScore = Math.max(0, bearScore - penalty);
            rules.push({ text: `⛔ Strong Uptrend — ตัด SELL Counter-Trend (-${penalty}pt)`, bias:'neutral', score:0 });
        }
        if (isStrongTrend && isBearTrend && bullScore > bearScore) {
            const penalty = Math.min(bullScore - bearScore, 6);
            bullScore = Math.max(0, bullScore - penalty);
            rules.push({ text: `⛔ Strong Downtrend — ตัด BUY Counter-Trend (-${penalty}pt)`, bias:'neutral', score:0 });
        }
        
        // ══ MTF CONFLICT VETO ══════════════════════════════
        // Daily ขัดแย้ง H1 = หักหนักมาก (Daily คือ King)
        if (dailyBear && bullScore > bearScore) {
            const pen = Math.min(bullScore, Math.round(bullScore * 0.5));
            bullScore = Math.max(0, bullScore - pen);
            rules.push({ text: `🚫 Daily BEAR Veto: BUY สวนทาง Macro Trend (-${pen}pt)`, bias:'neutral', score:0 });
        }
        if (dailyBull && bearScore > bullScore) {
            const pen = Math.min(bearScore, Math.round(bearScore * 0.5));
            bearScore = Math.max(0, bearScore - pen);
            rules.push({ text: `🚫 Daily BULL Veto: SELL สวนทาง Macro Trend (-${pen}pt)`, bias:'neutral', score:0 });
        }
        // H4 ขัดแย้ง H1 = หักปานกลาง
        if (h4Bear && !dailyBear && bullScore > bearScore) {
            bullScore = Math.round(bullScore * 0.7);
            rules.push({ text: `⚠️ H4 Downtrend Conflict: BUY สวนทาง H4 (-30%)`, bias:'neutral', score:0 });
        }
        if (h4Bull && !dailyBull && bearScore > bullScore) {
            bearScore = Math.round(bearScore * 0.7);
            rules.push({ text: `⚠️ H4 Uptrend Conflict: SELL สวนทาง H4 (-30%)`, bias:'neutral', score:0 });
        }


        // ══ VOLATILITY FILTER ══════════════════════════════
        const atrOk = atr >= 2 && atr <= 90;
        if (!atrOk) {
            rules.push({ text: `⚠️ ATR ${atr} ผิดปกติมาก — ลด reliability`, bias:'neutral', score:0 });
            bullScore = Math.round(bullScore * 0.7);
            bearScore = Math.round(bearScore * 0.7);
        }

        if (newsRisk.active) {
            const prePost  = newsRisk.minutesToEvent > 0 ? `อีก ${newsRisk.minutesToEvent} นาที` : `ผ่านไป ${Math.abs(newsRisk.minutesToEvent)} นาที`;
