            const critical = newsRisk.isGoldCritical ? '⚠️ Gold-Critical' : '📰';
            const mult     = newsRisk.isGoldCritical ? 0.45 : 0.55; // ข่าวกระทบทองโดยตรง = ลดแรงกว่า
            rules.push({ text: `${critical} News Block: ${newsRisk.name} (${prePost}) — ระงับสัญญาณชั่วคราว`, bias:'neutral', score:0 });
            bullScore = Math.round(bullScore * mult);
            bearScore = Math.round(bearScore * mult);
        }

        // ══ MULTI-INDICATOR CONFLUENCE ════════════════════
        const getType = txt =>
            txt.includes('RSI')?'rsi': txt.includes('MACD')?'macd': txt.includes('BB')?'bb':
            txt.includes('Stochastic')?'stoch': txt.includes('Williams')?'williams':
            txt.includes('Fib')?'fib': txt.includes('Pivot')?'pivot':
            txt.includes('Pullback')?'pullback': txt.includes('Swing')?'sr':
            txt.includes('rend') || txt.includes('ADX')?'trend':
            txt.includes('🕯')?'pattern': 'other';

        let bullTypes = new Set(rules.filter(r=>r.bias==='bull' && r.score>=2).map(r=>getType(r.text))).size;
        let bearTypes = new Set(rules.filter(r=>r.bias==='bear' && r.score>=2).map(r=>getType(r.text))).size;

        // ══ DOW THEORY STRUCTURE ══════════════════════════
        if (dowTrend.trend === 'UP') {
            bullScore += 4;
            bullTypes++;
            rules.push({ text:`📐 Dow Theory: Uptrend (HH+HL) — ${dowTrend.label}`, bias:'bull', score:4 });
        } else if (dowTrend.trend === 'DOWN') {
            bearScore += 4;
            bearTypes++;
            rules.push({ text:`📐 Dow Theory: Downtrend (LH+LL) — ${dowTrend.label}`, bias:'bear', score:4 });
        }
        if (dowTrend.trendChange) {
            rules.push({ text:`⚠️ Dow Theory: ${dowTrend.label} — ตรวจสอบก่อนเข้า!`, bias:'neutral', score:0 });
        }

        // ══ DEMAND & SUPPLY ZONE SCORING ══════════════════
        // Demand zone proximity → bullish
        const activeDemand = dsZones.demandZones.find(z => z.inZone || z.nearZone);
        if (activeDemand) {
            const bonus = activeDemand.freshness === 'FRESH'
                ? (activeDemand.inZone ? 6 : 4)
                : (activeDemand.inZone ? 3 : 2);
            bullScore += bonus;
            bullTypes++;
            const dist = activeDemand.inZone ? 'อยู่ในโซน!' : `ห่าง $${activeDemand.distFromPrice.toFixed(1)}`;
            rules.push({ text:`🟢 Demand Zone (${activeDemand.pattern}/${activeDemand.freshness}) — ${dist} Prox:${activeDemand.proximalLine}`, bias:'bull', score:bonus });
        }
        // Supply zone proximity → bearish
        const activeSupply = dsZones.supplyZones.find(z => z.inZone || z.nearZone);
        if (activeSupply) {
            const bonus = activeSupply.freshness === 'FRESH'
                ? (activeSupply.inZone ? 6 : 4)
                : (activeSupply.inZone ? 3 : 2);
            bearScore += bonus;
            bearTypes++;
            const dist = activeSupply.inZone ? 'อยู่ในโซน!' : `ห่าง $${activeSupply.distFromPrice.toFixed(1)}`;
            rules.push({ text:`🔴 Supply Zone (${activeSupply.pattern}/${activeSupply.freshness}) — ${dist} Prox:${activeSupply.proximalLine}`, bias:'bear', score:bonus });
        }
        // EMA50 as D&S filter (10% weight — from PDF Chapter 9)
        if (ema50 && currentPrice > ema50 && ema20 > ema50) {
            bullScore += 2; bullTypes++;
            rules.push({ text:`📊 EMA50 Filter: ราคา > EMA50 (${ema50}) — โครงสร้างขาขึ้น`, bias:'bull', score:2 });
        } else if (ema50 && currentPrice < ema50 && ema20 < ema50) {
            bearScore += 2; bearTypes++;
            rules.push({ text:`📊 EMA50 Filter: ราคา < EMA50 (${ema50}) — โครงสร้างขาลง`, bias:'bear', score:2 });
        }

        // ══ SIGNAL DETERMINATION ══════════════════════════
        const THRESHOLD = 11;  // ต้องการคะแนนขั้นต่ำ
        const DOMINANCE = 1.7; // ฝั่งชนะต้องมีคะแนน 1.7x
        const MIN_TYPES = 3;   // ต้องมี ≥3 indicator types เห็นตรงกัน

        let signal = 'HOLD';
        if (bullScore >= THRESHOLD && bullScore > bearScore * DOMINANCE && bullTypes >= MIN_TYPES)
            signal = 'BUY';
        else if (bearScore >= THRESHOLD && bearScore > bullScore * DOMINANCE && bearTypes >= MIN_TYPES)
            signal = 'SELL';

        // ══ CONFIDENCE CALCULATION ════════════════════════
        const domScore  = signal==='BUY' ? bullScore : signal==='SELL' ? bearScore : Math.max(bullScore,bearScore);
        const weakScore = signal==='BUY' ? bearScore : signal==='SELL' ? bullScore : Math.min(bullScore,bearScore);
        const actTypes  = signal==='BUY' ? bullTypes : bearTypes;

        let confidence = 0;
        if (signal !== 'HOLD') {
            // Base: 50 + ทุก 1 pt เหนือ threshold = +3.5%
            const base      = Math.min(76, 50 + (domScore - THRESHOLD) * 3.5);
            // Dominance bonus
            const domRatio  = weakScore > 0 ? domScore / weakScore : domScore / 1;
            const domBonus  = domRatio >= 3.5 ? 14 : domRatio >= 3 ? 11 : domRatio >= 2.5 ? 8 : domRatio >= 2 ? 5 : domRatio >= 1.8 ? 3 : 0;
            // Types bonus: ยิ่งมี indicator หลายประเภทยิ่งดี
            const typBonus  = Math.max(0, actTypes - MIN_TYPES) * 3;
            // Regime bonus: Strong trend = confidence สูงขึ้น
            const regBonus  = isStrongTrend ? 5 : isTrending ? 2 : 0;
            // Session bonus
            const sBonus    = isHighLiq ? 4 : isLondon ? 2 : 0;
            // MTF Alignment bonus: Daily + H4 + H1 agree = +8
            const isBuySignal  = signal === 'BUY';
            const isSellSignal = signal === 'SELL';
            const mtfAligned   = (isBuySignal  && dailyBull && h4Bull) ? 8
                               : (isSellSignal && dailyBear && h4Bear) ? 8
                               : (isBuySignal  && (dailyBull || h4Bull)) ? 4
                               : (isSellSignal && (dailyBear || h4Bear)) ? 4 : 0;
            // Gold Fix Timing bonus: London Fix = +5, COMEX = +3
            const fixConfBonus = (fixWin.inAmFix || fixWin.inPmFix) ? 5 : fixWin.inComex ? 3 : fixWin.inSilver ? 1 : 0;
            confidence = Math.min(97, Math.round(base + domBonus + typBonus + regBonus + sBonus + mtfAligned + fixConfBonus));
        } else {
            confidence = Math.min(60, Math.round(domScore / THRESHOLD * 60));
        }

        const strength = domScore >= 20 ? '🔥 แรงมาก' : domScore >= 15 ? '💪 ปานกลาง' : '😐 อ่อน';

        // ══ ENTRY / TP / SL ════════════════════════════════
        let entryPrice = 0, takeProfit = 0, stopLoss = 0;
        if (signal !== 'HOLD') {
            entryPrice = +currentPrice.toFixed(2);

            // SL/TP base: ATR-based
            const slBase = +(atr * 1.0).toFixed(2);
            const tpBase = +(atr * 2.2).toFixed(2);

            if (signal === 'BUY') {
                stopLoss   = +(currentPrice - slBase - executionBuffer).toFixed(2);
                takeProfit = +(currentPrice + tpBase - executionBuffer).toFixed(2);
                // TP: ปรับตาม Swing Resistance / Fib / Pivot
                const candidates = [];
                if (swings) swings.resistances.filter(r => r > currentPrice + atr * 0.5).forEach(r => candidates.push(r));
                if (fib) [fib.r618, fib.r500, fib.r786, fib.high].filter(l => l > currentPrice + atr * 0.5).forEach(l => candidates.push(l));
                if (pivots) [pivots.r1, pivots.r2, pivots.r3].filter(l => l > currentPrice + atr * 0.5).forEach(l => candidates.push(l));
                if (candidates.length) {
                    const nearTP = Math.min(...candidates);
                    if (Math.abs(nearTP - currentPrice) > slBase * 1.5) takeProfit = +(nearTP - executionBuffer).toFixed(2);
                }
                // TP: ปรับตาม Supply Zone (D&S Strategy — บทที่ 7)
                const supplyTP = dsZones.supplyZones.filter(z => z.proximalLine > currentPrice + atr * 0.5)
                    .sort((a,b) => a.proximalLine - b.proximalLine)[0];
                if (supplyTP && supplyTP.proximalLine - currentPrice > slBase * 1.5)
                    takeProfit = +(supplyTP.proximalLine - executionBuffer).toFixed(2);
                // SL: ปรับตาม Demand Zone distal line (ต่ำกว่า distal = zone โดนทะลุ)
                const demandSL = dsZones.demandZones.filter(z => z.distalLine < currentPrice - atr * 0.3)
                    .sort((a,b) => b.distalLine - a.distalLine)[0];
                if (demandSL) stopLoss = +(demandSL.distalLine - executionBuffer - atr * 0.15).toFixed(2);
                // SL: ปรับตาม Swing Support / Fib / Pivot
                const slCand = [];
                if (swings) swings.supports.filter(s => s < currentPrice - atr * 0.3).forEach(s => slCand.push(s));
                if (fib) [fib.r382, fib.r236, fib.r000].filter(l => l < currentPrice - atr * 0.3).forEach(l => slCand.push(l));
                if (pivots) [pivots.s1, pivots.s2, pivots.pp].filter(l => l < currentPrice - atr * 0.3).forEach(l => slCand.push(l));
                if (slCand.length) {
                    const swingSL = +(Math.max(...slCand) - atr * 0.15 - executionBuffer).toFixed(2);
                    if (!demandSL || swingSL > stopLoss) stopLoss = swingSL;
                }

            } else {
                stopLoss   = +(currentPrice + slBase + executionBuffer).toFixed(2);
                takeProfit = +(currentPrice - tpBase + executionBuffer).toFixed(2);
                const candidates = [];
                if (swings) swings.supports.filter(s => s < currentPrice - atr * 0.5).forEach(s => candidates.push(s));
                if (fib) [fib.r382, fib.r236, fib.r000, fib.low].filter(l => l < currentPrice - atr * 0.5).forEach(l => candidates.push(l));
                if (pivots) [pivots.s1, pivots.s2, pivots.s3].filter(l => l < currentPrice - atr * 0.5).forEach(l => candidates.push(l));
                if (candidates.length) {
                    const nearTP = Math.max(...candidates);
                    if (Math.abs(currentPrice - nearTP) > slBase * 1.5) takeProfit = +(nearTP + executionBuffer).toFixed(2);
                }
                // TP: ปรับตาม Demand Zone (D&S Strategy — บทที่ 7)
                const demandTP = dsZones.demandZones.filter(z => z.proximalLine < currentPrice - atr * 0.5)
                    .sort((a,b) => b.proximalLine - a.proximalLine)[0];
                if (demandTP && currentPrice - demandTP.proximalLine > slBase * 1.5)
                    takeProfit = +(demandTP.proximalLine + executionBuffer).toFixed(2);
                // SL: ปรับตาม Supply Zone distal line
                const supplySL = dsZones.supplyZones.filter(z => z.distalLine > currentPrice + atr * 0.3)
                    .sort((a,b) => a.distalLine - b.distalLine)[0];
                if (supplySL) stopLoss = +(supplySL.distalLine + executionBuffer + atr * 0.15).toFixed(2);
                const slCand = [];
                if (swings) swings.resistances.filter(r => r > currentPrice + atr * 0.3).forEach(r => slCand.push(r));
                if (fib) [fib.r618, fib.r786, fib.high].filter(l => l > currentPrice + atr * 0.3).forEach(l => slCand.push(l));
                if (pivots) [pivots.r1, pivots.r2, pivots.pp].filter(l => l > currentPrice + atr * 0.3).forEach(l => slCand.push(l));
                if (slCand.length) {
                    const swingSL = +(Math.min(...slCand) + atr * 0.15 + executionBuffer).toFixed(2);
                    if (!supplySL || swingSL < stopLoss) stopLoss = swingSL;
                }
            }
        }

        const rrRatio = entryPrice && stopLoss && takeProfit
            ? +(Math.abs(takeProfit - entryPrice) / Math.abs(stopLoss - entryPrice)).toFixed(2)
            : 0;

        // ══ FUNDAMENTAL CONTEXT ════════════════════════════
        const fundContext = [];
        // Gold Fix timing context
        const fixCtx = fixWin.isActive
            ? `🕐 ${fixWin.active} ACTIVE — Institutional Volume Window (Confidence +${(fixWin.inAmFix||fixWin.inPmFix)?5:3})`
            : fixWin.upcoming.length > 0
            ? `⏱️ Next Fix: ${fixWin.upcoming[0].name} (${fixWin.upcoming[0].bkkTime} BKK | ${fixWin.upcoming[0].minsTo} นาที)`
            : '';
        fundContext.push(`📅 Session: ${sessions.map(s=>s.name).join(', ')} | Regime: ${regime} (ADX ${adxVal})${fixCtx ? ' | ' + fixCtx : ''}`);
        if (currentPrice > ema200 * 1.015) fundContext.push('📈 แนวโน้มใหญ่ขาขึ้น (ราคาเหนือ EMA200)');
        else if (currentPrice < ema200 * 0.985) fundContext.push('📉 แนวโน้มใหญ่ขาลง (ราคาต่ำกว่า EMA200)');
        else fundContext.push('↔️ แนวโน้มใหญ่ Sideway (ราคาใกล้ EMA200)');
        // Dow Theory context
        if (dowTrend.trend !== 'NEUTRAL' || dowTrend.trendChange) {
            fundContext.push(`📐 Dow Theory: ${dowTrend.label}${dowTrend.trendChange?' ⚠️ กำลังเปลี่ยนทิศ':''}`);
        }
        // D&S Zone context
        const fDemand = dsZones.demandZones[0];
        const fSupply = dsZones.supplyZones[0];
        if (fDemand) fundContext.push(`🟢 Demand Zone ${fDemand.pattern}/${fDemand.freshness}: $${fDemand.proximalLine}–$${fDemand.distalLine}${fDemand.inZone?' [ราคาอยู่ในโซน!]':''}`);
        if (fSupply) fundContext.push(`🔴 Supply Zone ${fSupply.pattern}/${fSupply.freshness}: $${fSupply.distalLine}–$${fSupply.proximalLine}${fSupply.inZone?' [ราคาอยู่ในโซน!]':''}`);
        if (atr > 25) fundContext.push('⚡ Volatility สูงมาก — ระวัง Stop Hunt, ขยาย SL');
        else if (atr < 7) fundContext.push('😴 Volatility ต่ำ — อาจรอ Breakout ก่อนเข้า');
        if (bb.squeeze) fundContext.push('🔔 BB Squeeze: Breakout กำลังจะเกิด — เตรียมพร้อม');
        // Daily Loss Limit context
        if (analysis?.dailyLossInfo?.limitHit) {
            fundContext.push(`⛔ Daily Loss Limit ถึงแล้ว (${analysis.dailyLossInfo.lossPct?.toFixed(2)}%) — สัญญาณถูกระงับทั้งวัน`);
        } else if (analysis?.dailyLossInfo?.lossPct >= (analysis.dailyLossInfo?.limit ?? 3) * 0.75) {
            fundContext.push(`⚠️ ใกล้ Daily Loss Limit — ระวัง! ขาดทุนวันนี้ ${analysis.dailyLossInfo.lossPct?.toFixed(2)}% / ${analysis.dailyLossInfo.limit}%`);
        }
        if (newsRisk.active) {
            const prePost  = newsRisk.minutesToEvent > 0 ? `อีก ${newsRisk.minutesToEvent} นาที` : `ผ่านไป ${Math.abs(newsRisk.minutesToEvent)} นาที`;
            fundContext.push(`⛔ News Block: ${newsRisk.name} (${prePost}) — ${newsRisk.isGoldCritical ? 'ข่าวกระทบทองโดยตรง งดเข้าทุกไม้' : 'ลดขนาด position หรืองดเข้าใหม่'}`);
        }
        if (dxy && dxy.lastUpdate) {
            const dxyEmoji = dxy.signal==='BULLISH_GOLD' ? '💚' : dxy.signal==='BEARISH_GOLD' ? '🔴' : '⚪';
            const dxyGoldImpact = dxy.signal==='BULLISH_GOLD' ? 'หนุนทองขึ้น' : dxy.signal==='BEARISH_GOLD' ? 'กดดันทองลง' : 'ผลกระทบเป็นกลาง';
            fundContext.push(`${dxyEmoji} DXY: ${dxy.price?.toFixed(2) ?? '-'} | Trend: ${dxy.trend} (${dxy.momentum>0?'+':''}${dxy.momentum}%) | ${dxyGoldImpact} [${dxy.strength}]`);
        } else {
            fundContext.push('💡 หนุนทอง: DXY อ่อน, เงินเฟ้อสูง, ความเสี่ยงภูมิรัฐ, Fed Dovish');
            fundContext.push('⚠️ กดทอง: DXY แข็ง, Fed Hawkish, Risk-on, Bond Yield ขึ้น');
        }

        // ══ BUILD REASON ══════════════════════════════════
        const topBull = rules.filter(r => r.bias==='bull').sort((a,b) => b.score-a.score).slice(0,5);
        const topBear = rules.filter(r => r.bias==='bear').sort((a,b) => b.score-a.score).slice(0,5);
        const reason = signal === 'BUY'
            ? `🟢 BUY Signal | ${regime} | คะแนน ${bullScore} vs ${bearScore}\n\nสัญญาณหนุน:\n${topBull.map(r=>`• ${r.text}`).join('\n')}\n\nRR ${rrRatio}:1 | ${strength}`
            : signal === 'SELL'
            ? `🔴 SELL Signal | ${regime} | คะแนน ${bearScore} vs ${bullScore}\n\nสัญญาณกดดัน:\n${topBear.map(r=>`• ${r.text}`).join('\n')}\n\nRR ${rrRatio}:1 | ${strength}`
            : `⏸ HOLD — รอสัญญาณชัดขึ้น | H4: ${h4Trend} | H1: ${regime}\nคะแนนซื้อ: ${bullScore} (${bullTypes} types) | คะแนนขาย: ${bearScore} (${bearTypes} types)\nต้องการ ≥${THRESHOLD}pt + ${MIN_TYPES} types\n\n${[...topBull,...topBear].sort((a,b)=>b.score-a.score).slice(0,4).map(r=>`• ${r.text}`).join('\n')}`;

        const timeframe = atr > 20 ? 'Swing Trade' : atr > 10 ? 'Day Trade' : 'Scalp';

        return { signal, confidence, entryPrice, takeProfit, stopLoss, rrRatio, strength, reason, bullScore, bearScore, rules, patterns, fundContext, timeframe, regime, dsZones, dowTrend };
    };

    const buildAnalysisFromCandles = (candles) => {
        const closes = candles.map(c => c[4]);
        const sma50  = closes.length >= 50 ? closes.slice(-50).reduce((a,b)=>a+b,0)/50 : 0;
        return {
            rsi:      calcRSI(closes, 14),
            sma50:    +sma50.toFixed(2),
            ema20:    +calcEMA(closes, 20).toFixed(2),
            ema50:    +calcEMA(closes, 50).toFixed(2),
            ema200:   +calcEMA(closes, 200).toFixed(2),
            macd:     calcMACD(closes),
            bb:       calcBB(closes, 20, 2),
            atr:      calcATR(candles, 14),
            stoch:    calcStochastic(candles, 14, 3, 3),
            williamsR: calcWilliamsR(candles, 14),
            adx:      calcADX(candles, 14),
            swings:   findSwingLevels(candles, 80),
            fib:      calcFib(candles, 60),
            pivots:   calcPivotPoints(candles),
            sessions: getMarketSessions(),
            rawCandles: candles.slice(-5)
        };
    };

    const runQuickBacktest = (candles, h4Context) => {
        const trades = [];
        const start = Math.max(200, candles.length - 180);
        for (let i = start; i < candles.length - 13; i++) {
            const slice = candles.slice(0, i + 1);
            const analysis = buildAnalysisFromCandles(slice);
            const price = slice[slice.length - 1][4];
            const result = runTechnicalAnalysis(slice, price, analysis, h4Context);
            if (!(result.signal === 'BUY' || result.signal === 'SELL') || result.confidence < 80 || result.rrRatio < 1.2) continue;
            let outcome = 'OPEN';
            for (const c of candles.slice(i + 1, i + 13)) {
                const high = c[2], low = c[3];
                if (result.signal === 'BUY') {
                    if (low <= result.stopLoss) { outcome = 'LOSS'; break; }
                    if (high >= result.takeProfit) { outcome = 'WIN'; break; }
                } else {
                    if (high >= result.stopLoss) { outcome = 'LOSS'; break; }
                    if (low <= result.takeProfit) { outcome = 'WIN'; break; }
                }
            }
            if (outcome !== 'OPEN') trades.push({ outcome, rr: result.rrRatio });
            if (trades.length >= 60) break;
        }
        const wins = trades.filter(t => t.outcome === 'WIN');
        const losses = trades.filter(t => t.outcome === 'LOSS');
        const grossWinR = wins.reduce((s, t) => s + t.rr, 0);
        const grossLossR = losses.length;
        return {
            total: trades.length,
            winRate: trades.length ? +(wins.length / trades.length * 100).toFixed(1) : 0,
            profitFactor: grossLossR ? +(grossWinR / grossLossR).toFixed(2) : (wins.length ? 99 : 0),
            expectancyR: trades.length ? +((grossWinR - grossLossR) / trades.length).toFixed(2) : 0
        };
    };

    const runIndicatorSelfCheck = () => {
        const candles = Array.from({ length: 80 }, (_, i) => {
            const close = 1900 + i * 0.7 + Math.sin(i / 3) * 4;
            return [Date.now() + i * 3600000, close - 1.5, close + 3, close - 3, close, 1000 + i];
        });
        const closes = candles.map(c => c[4]);
        const checks = [
            ['RSI range', calcRSI(closes, 14) >= 0 && calcRSI(closes, 14) <= 100],
            ['MACD finite', Number.isFinite(calcMACD(closes).histogram)],
            ['ATR positive', calcATR(candles, 14) > 0],
            ['ADX range', calcADX(candles, 14).adx >= 0 && calcADX(candles, 14).adx <= 100],
            ['Stochastic range', calcStochastic(candles, 14, 3, 3).k >= 0 && calcStochastic(candles, 14, 3, 3).k <= 100],
            ['Williams %R range', calcWilliamsR(candles, 14).value >= -100 && calcWilliamsR(candles, 14).value <= 0],
        ];
        const failed = checks.filter(([, ok]) => !ok).map(([name]) => name);
        return { ok: failed.length === 0, failed };
    };

    class ErrorBoundary extends React.Component {
        constructor(props) { super(props); this.state = { hasError: false, error: null }; }
        static getDerivedStateFromError(e) { return { hasError: true, error: e }; }
        render() {
            if (this.state.hasError) return (
                <div className="p-10 text-red-500 bg-stone-900 min-h-screen flex flex-col items-center justify-center">
                    <i className="fa-solid fa-triangle-exclamation text-6xl mb-4"></i>

                    <p className="text-stone-400 bg-black p-4 rounded-lg font-mono text-sm max-w-2xl text-center">{this.state.error?.message}</p>
                </div>
            );
            return this.props.children;
        }
    }

                if (ev.date && /^\d{4}-\d{2}-\d{2}T/.test(ev.date)) return ev.date;
                // fallback: try combine date + time
                if (ev.date && ev.time) {
                    // ev.time may be "10:00am" ET — convert to UTC (ET = UTC-4/5)
                    // rough conversion: assume EDT (UTC-4) for May-Nov, EST (UTC-5) Nov-Mar
                    const now = new Date();
                    const isDST = now.getMonth() >= 2 && now.getMonth() <= 10;
                    const etOffset = isDST ? 4 : 5; // hours behind UTC
                    const t = ev.time.match(/(\d+):(\d+)(am|pm)/i);
                    if (t) {
                        let h = parseInt(t[1]); const m = parseInt(t[2]); const pm = t[3].toLowerCase()==='pm';
                        if (pm && h !== 12) h += 12;
                        if (!pm && h === 12) h = 0;
                        return `${ev.date}T${String(h + etOffset).padStart(2,'0')}:${String(m).padStart(2,'0')}:00.000Z`;

        useEffect(() => {
            if (!displayPrice || tradeHistory.length === 0) return;
            const BE_BUFFER       = 0.50;   // $0.50 เหนือ/ใต้ entry สำหรับ breakeven
            const TRAIL_START_R   = 1.5;    // เริ่ม trailing หลังทำกำไร 1.5R
            const TRAIL_DIST_R    = 0.75;   // trail ห่าง 0.75R จาก peak
            setTradeHistory(prev => {
                let anyChanged = false;
                const updated = prev.map(t => {
                    if (t.status !== 'PENDING') return t;
                    let tradeChanged = false;

                    // ── ดึงค่าปัจจุบัน ──────────────────────────
                    let sl        = t.sl;
                    let slStatus  = t.slStatus  || 'ORIGINAL';
                    const slOrig  = t.slOriginal ?? t.sl;
                    const riskDist = Math.abs(t.entry - slOrig);
                    if (riskDist <= 0) {
                        // ไม่มีข้อมูล risk — ตรวจ TP/SL ปกติ
                        let s = 'PENDING';
                        if (t.signal==='BUY')  { if(displayPrice>=t.tp) s='WIN'; else if(displayPrice<=sl) s='LOSS'; }
                        else                   { if(displayPrice<=t.tp) s='WIN'; else if(displayPrice>=sl) s='LOSS'; }
                        if (s!=='PENDING') { anyChanged=true; return {...t, status:s, profitUsd: s==='WIN'?t.expectedProfit:-t.riskAmount}; }
                        return t;
                    }

                    let highestPrice = t.highestPrice ?? t.entry;
                    let lowestPrice  = t.lowestPrice  ?? t.entry;

                    if (t.signal === 'BUY') {
                        // อัพเดต peak price
                        if (displayPrice > highestPrice) { highestPrice = displayPrice; tradeChanged = true; }

                        // ── Breakeven: ราคาขึ้น 1R ──────────────
                        if (slStatus === 'ORIGINAL' && displayPrice >= t.entry + riskDist) {
                            const beSL = +(t.entry + BE_BUFFER).toFixed(2);
                            if (beSL > sl) { sl = beSL; slStatus = 'BREAKEVEN'; tradeChanged = true; }
                        }
                        // ── Trailing: ราคาขึ้น 1.5R ─────────────
                        if (displayPrice >= t.entry + riskDist * TRAIL_START_R) {
                            const trailSL = +(highestPrice - riskDist * TRAIL_DIST_R).toFixed(2);
                            if (trailSL > sl) { sl = trailSL; slStatus = 'TRAILING'; tradeChanged = true; }
                        }
                    } else { // SELL
                        if (displayPrice < lowestPrice) { lowestPrice = displayPrice; tradeChanged = true; }

                        if (slStatus === 'ORIGINAL' && displayPrice <= t.entry - riskDist) {
                            const beSL = +(t.entry - BE_BUFFER).toFixed(2);
                            if (beSL < sl) { sl = beSL; slStatus = 'BREAKEVEN'; tradeChanged = true; }
                        }
                        if (displayPrice <= t.entry - riskDist * TRAIL_START_R) {
                            const trailSL = +(lowestPrice + riskDist * TRAIL_DIST_R).toFixed(2);
                            if (trailSL < sl) { sl = trailSL; slStatus = 'TRAILING'; tradeChanged = true; }
                        }
                    }

                    // ── ตรวจ TP / SL hit ────────────────────────
                    let status = 'PENDING';
                    if (t.signal === 'BUY')  { if (displayPrice >= t.tp) status='WIN'; else if (displayPrice <= sl) status='LOSS'; }
                    else                     { if (displayPrice <= t.tp) status='WIN'; else if (displayPrice >= sl) status='LOSS'; }

                    if (status !== 'PENDING') {
                        anyChanged = true;
                        // P&L จริง: คำนวณจาก sl ที่ถูก hit (ไม่ใช่ original risk เสมอ)
                        let profitUsd;
                        if (status === 'WIN') {
                            profitUsd = +(Math.abs(t.tp - t.entry) * (t.unitsToTrade || 0)).toFixed(2);
                        } else {
                            // SL hit — PnL = (sl - entry) * units (อาจ + ถ้า BE/Trailing)

                        }
                        return { ...t, sl, slStatus, highestPrice, lowestPrice, status, profitUsd };
                    }

                    if (tradeChanged) {

                        return { ...t, sl, slStatus, highestPrice, lowestPrice };

                    return t;

            return {

                                    </p>
                                    <p className="text-[10px] text-stone-600 mt-1 leading-tight">ค่า &lt;30 = ราคาถูกเกิน (โอกาสซื้อ) | &gt;70 = ราคาแพงเกิน (โอกาสขาย)</p>
                                </div>

                                {/* Stochastic */}
                                <div className="bg-stone-950 p-3 rounded-lg border border-stone-800 flex flex-col">
                                    <div className="flex items-center justify-between mb-1">
                                        <p className="text-xs text-stone-500 font-semibold">Stochastic (14,3)</p>
                                        <span className="text-[10px] text-stone-600 bg-stone-900 px-1.5 py-0.5 rounded">วัดโมเมนตัม</span>
                                    </div>
                                    <p className={`text-2xl font-bold ${stochColor}`}>%K {basicAnalysis.stoch.k}</p>
                                    <p className="text-xs text-stone-500">%D (signal): {basicAnalysis.stoch.d}</p>
                                    <p className={`text-xs mt-1.5 font-semibold ${stochColor}`}>
                                        {basicAnalysis.stoch.k>80?'🔴 Overbought — แรงซื้อหมด':basicAnalysis.stoch.k<20?'🟢 Oversold — แรงขายหมด':'🟡 ปกติ'}
                                    </p>
                                    <p className="text-[10px] text-stone-600 mt-1 leading-tight">%K ตัด %D ขึ้น = สัญญาณซื้อ | %K ตัด %D ลง = สัญญาณขาย</p>
                                </div>

                                {/* Williams %R */}
                                {(() => {
                                    const wr = basicAnalysis.williamsR;
                                    if (!wr) return null;
                                    const wrColor = wr.overbought ? 'text-red-400' : wr.oversold ? 'text-green-400' : wr.zone==='bull_zone' ? 'text-green-300' : 'text-red-300';
                                    // แปลง -100…0 → bar width 0…100%
                                    const barPct = Math.round(wr.value + 100); // 0 = oversold, 100 = overbought
                                    return (
                                        <div className="bg-stone-950 p-3 rounded-lg border border-stone-800 flex flex-col">
                                            <div className="flex items-center justify-between mb-1">
                                                <p className="text-xs text-stone-500 font-semibold">Williams %R (14)</p>
                                                <span className="text-[10px] text-stone-600 bg-stone-900 px-1.5 py-0.5 rounded">Leading</span>
                                            </div>
                                            <p className={`text-2xl font-bold ${wrColor}`}>{wr.value}</p>
                                            <p className="text-xs text-stone-500">Prev: {wr.prev}</p>
                                            <div className="w-full bg-stone-800 rounded-full h-1.5 mt-1.5 relative">
                                                <div className={`h-1.5 rounded-full score-bar ${wr.overbought?'bg-red-500':wr.oversold?'bg-green-500':'bg-yellow-500'}`}
                                                     style={{width:`${barPct}%`}}></div>
                                                <div className="absolute top-0 h-1.5 w-px bg-green-600/60" style={{left:'0%'}}></div>
                                                <div className="absolute top-0 h-1.5 w-px bg-yellow-600/60" style={{left:'50%'}}></div>
                                                <div className="absolute top-0 h-1.5 w-px bg-red-600/60" style={{left:'100%'}}></div>
                                            </div>
                                            <div className="flex justify-between text-[9px] text-stone-600 mt-0.5">
                                                <span>-100 Oversold</span><span>-50</span><span>0 Overbought</span>
                                            </div>
                                            <p className={`text-xs mt-1.5 font-semibold ${wrColor}`}>
                                                {wr.overbought ? '🔴 Overbought (>-20) — โอกาสลง'
                                                 : wr.oversold  ? '🟢 Oversold (<-80) — โอกาสขึ้น'
                                                 : wr.crossAbove50 ? '🟡 ข้าม -50 ขึ้น — Momentum Bull'
                                                 : wr.crossBelow50 ? '🟡 ข้าม -50 ลง — Momentum Bear'
                                                 : wr.zone==='bull_zone' ? '🟡 Bull Zone (-50 ถึง -20)' : '🟡 Bear Zone (-80 ถึง -50)'}
                                            </p>
                                            <p className="text-[10px] text-stone-600 mt-1 leading-tight">เร็วกว่า Stochastic — Leading indicator จับจุดกลับตัว</p>
                                        </div>
                                    );
                                })()}

                                {/* MACD */}
                                <div className="bg-stone-950 p-3 rounded-lg border border-stone-800 flex flex-col">
                                    <div className="flex items-center justify-between mb-1">
                                        <p className="text-xs text-stone-500 font-semibold">MACD (12,26,9)</p>
                                        <span className="text-[10px] text-stone-600 bg-stone-900 px-1.5 py-0.5 rounded">แนวโน้ม</span>
                                    </div>
                                    <p className={`text-xl font-bold ${macdColor}`}>{basicAnalysis.macd.macd}</p>
                                    <p className="text-xs text-stone-500">Signal: {basicAnalysis.macd.signal}</p>
                                    <p className={`text-xs mt-0.5 ${basicAnalysis.macd.histogram>=0?'text-green-400':'text-red-400'}`}>
                                        Hist: {basicAnalysis.macd.histogram>=0?'▲':'▼'} {basicAnalysis.macd.histogram}
                                    </p>
                                    <p className={`text-xs mt-1 font-semibold ${macdColor}`}>
                                        {basicAnalysis.macd.trend==='bullish'?'🟢 Bullish Cross — แนวโน้มขึ้น':
                                         basicAnalysis.macd.trend==='bearish'?'🔴 Bearish Cross — แนวโน้มลง':
                                         basicAnalysis.macd.trend==='weak_bullish'?'🟡 อยู่เหนือ Signal':
                                         '🟡 อยู่ใต้ Signal'}
                                    </p>
                                    <p className="text-[10px] text-stone-600 mt-1 leading-tight">Hist โต = momentum แรงขึ้น | Hist หด = momentum อ่อนลง</p>
                                </div>

                                {/* BB */}
                                <div className="bg-stone-950 p-3 rounded-lg border border-stone-800 flex flex-col">
                                    <div className="flex items-center justify-between mb-1">
                                        <p className="text-xs text-stone-500 font-semibold">Bollinger Bands</p>
                                        <span className="text-[10px] text-stone-600 bg-stone-900 px-1.5 py-0.5 rounded">ช่วงราคา</span>
                                    </div>
                                    <p className="text-xs text-stone-400">Upper (แนวต้าน): <span className="text-red-400 font-bold">{basicAnalysis.bb.upper}</span></p>
                                    <p className="text-xs text-stone-400">Mid (เส้นกลาง): <span className="text-yellow-400 font-bold">{basicAnalysis.bb.middle}</span></p>
                                    <p className="text-xs text-stone-400">Lower (แนวรับ): <span className="text-green-400 font-bold">{basicAnalysis.bb.lower}</span></p>
                                    <p className={`text-xs mt-1.5 font-semibold ${basicAnalysis.bb.pctB<10?'text-green-400':basicAnalysis.bb.pctB>90?'text-red-400':'text-stone-400'}`}>
                                        {basicAnalysis.bb.pctB<10?'🟢 ราคาแตะแนวรับล่าง':basicAnalysis.bb.pctB>90?'🔴 ราคาแตะแนวต้านบน':'ราคาอยู่ในช่วงปกติ'}
                                    </p>
                                    <p className={`text-[10px] mt-1 leading-tight ${basicAnalysis.bb.squeeze?'text-yellow-400 font-semibold':'text-stone-600'}`}>
                                        BW: {basicAnalysis.bb.bandwidth}% {basicAnalysis.bb.squeeze?'🔔 Squeeze! — เตรียมรับ Breakout':'| ยิ่ง BW น้อย = ยิ่งนิ่ง รอระเบิด'}
                                    </p>
                                </div>

                                {/* EMA */}
                                <div className="bg-stone-950 p-3 rounded-lg border border-stone-800 flex flex-col">
                                    <div className="flex items-center justify-between mb-1">
                                        <p className="text-xs text-stone-500 font-semibold">EMA Trend</p>
                                        <span className="text-[10px] text-stone-600 bg-stone-900 px-1.5 py-0.5 rounded">ทิศทางใหญ่</span>
                                    </div>
                                    <p className="text-xs text-stone-400">EMA20 (ระยะสั้น): <span className="text-blue-400 font-bold">{basicAnalysis.ema20}</span></p>
                                    <p className="text-xs text-stone-400">EMA200 (ระยะยาว): <span className="text-purple-400 font-bold">{basicAnalysis.ema200}</span></p>
                                    <p className="text-xs text-stone-400 mt-0.5">SMA50: <span className="text-yellow-400">{basicAnalysis.sma50}</span></p>
                                    <p className={`text-xs mt-1.5 font-bold ${basicAnalysis.ema20>basicAnalysis.ema200?'text-green-400':'text-red-400'}`}>
                                        {basicAnalysis.ema20>basicAnalysis.ema200?'🟢 Golden Cross — เทรนด์ขาขึ้น':'🔴 Death Cross — เทรนด์ขาลง'}
                                    </p>
                                    <p className="text-[10px] text-stone-600 mt-1 leading-tight">EMA20 &gt; EMA200 = ตลาดกระทิง | EMA20 &lt; EMA200 = ตลาดหมี</p>
                                </div>

                                {/* ATR */}
                                <div className="bg-stone-950 p-3 rounded-lg border border-stone-800 flex flex-col">
                                    <div className="flex items-center justify-between mb-1">
                                        <p className="text-xs text-stone-500 font-semibold">ATR (14) ความผันผวน</p>
                                        <span className="text-[10px] text-stone-600 bg-stone-900 px-1.5 py-0.5 rounded">ขนาด SL/TP</span>
                                    </div>
                                    <p className={`text-2xl font-bold ${basicAnalysis.atr>20?'text-red-400':basicAnalysis.atr>10?'text-orange-400':'text-green-400'}`}>{basicAnalysis.atr}</p>
                                    <p className="text-xs text-stone-500">USD/oz เฉลี่ยต่อชั่วโมง</p>
                                    <p className="text-xs mt-1 text-stone-400">SL แนะนำ: <span className="text-red-400 font-bold">{(basicAnalysis.atr*1.4).toFixed(2)}</span> pts</p>
                                    <p className="text-xs text-stone-400">TP แนะนำ: <span className="text-green-400 font-bold">{(basicAnalysis.atr*2.5).toFixed(2)}</span> pts</p>
                                    <p className="text-[10px] text-stone-600 mt-1 leading-tight">
                                        {basicAnalysis.atr>20?'⚡ ผันผวนสูง — ตั้ง SL ให้กว้าง':basicAnalysis.atr<8?'😴 ผันผวนต่ำ — รอ Breakout':'ผันผวนปกติ | ใช้ค่านี้กำหนด SL/TP'}
                                    </p>
                                </div>

                                {/* ADX — Market Regime */}
                                <div className="bg-stone-950 p-3 rounded-lg border border-stone-800 flex flex-col">
                                    <div className="flex items-center justify-between mb-1">
                                        <p className="text-xs text-stone-500 font-semibold">ADX (14) ความแรง Trend</p>
                                        <span className="text-[10px] text-stone-600 bg-stone-900 px-1.5 py-0.5 rounded">Regime</span>
                                    </div>
                                    <p className={`text-2xl font-bold ${adxColor}`}>{basicAnalysis.adx?.adx ?? '-'}</p>
                                    <p className="text-xs text-stone-500">+DI: <span className="text-green-400">{basicAnalysis.adx?.pdi ?? '-'}</span> | -DI: <span className="text-red-400">{basicAnalysis.adx?.mdi ?? '-'}</span></p>
                                    <p className={`text-xs mt-1.5 font-semibold ${adxColor}`}>
                                        {basicAnalysis.adx?.strong ? '🔥 Trend แรงมาก (>28) — ใช้ Trend Following' :
                                         basicAnalysis.adx?.trending ? '⚡ Trending (>22) — เข้าตาม Pullback' :
                                         '↔️ Ranging (<22) — ใช้ Mean Reversion'}
                                    </p>
                                    <p className="text-[10px] text-stone-600 mt-1 leading-tight">ADX &gt;22=Trend, &lt;22=Range | +DI&gt;-DI=ขาขึ้น | -DI&gt;+DI=ขาลง</p>
                                </div>
                            </div>

                            {/* Swing S/R Levels */}
                            {basicAnalysis.swings && (basicAnalysis.swings.supports.length > 0 || basicAnalysis.swings.resistances.length > 0) && (
                                <div className="mt-4 p-3 bg-stone-950 rounded-lg border border-blue-900/30">
                                    <p className="text-xs font-semibold text-blue-400 mb-2">
                                        <i className="fa-solid fa-arrows-up-down mr-1"></i> Swing High/Low — Price Action S/R
                                        <span className="ml-2 text-stone-500 font-normal">ระดับแนวรับ/แนวต้านจาก Price Action จริง</span>
                                    </p>
                                    <div className="grid grid-cols-2 gap-3 text-xs">
                                        <div>
                                            <p className="text-stone-500 text-[10px] mb-1">🔴 แนวต้าน (Resistance)</p>
                                            {[...(basicAnalysis.swings.resistances||[])].reverse().map((r,i)=>(
                                                <div key={i} className="flex justify-between items-center mb-0.5">
                                                    <span className="text-red-400 font-bold">{r}</span>
                                                    {displayPrice > 0 && Math.abs(displayPrice-r) < (basicAnalysis.atr*0.6) && <span className="text-yellow-400 text-[10px]">◄ ใกล้!</span>}
                                                </div>
                                            ))}
                                        </div>
                                        <div>
                                            <p className="text-stone-500 text-[10px] mb-1">🟢 แนวรับ (Support)</p>
                                            {[...(basicAnalysis.swings.supports||[])].reverse().map((s,i)=>(
                                                <div key={i} className="flex justify-between items-center mb-0.5">
                                                    <span className="text-green-400 font-bold">{s}</span>
                                                    {displayPrice > 0 && Math.abs(displayPrice-s) < (basicAnalysis.atr*0.6) && <span className="text-yellow-400 text-[10px]">◄ ใกล้!</span>}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Fibonacci */}
                            {basicAnalysis.fib && (
                                <div className="mt-4 p-3 bg-stone-950 rounded-lg border border-yellow-900/30">
                                    <div className="flex items-start justify-between mb-2 flex-wrap gap-1">
                                        <p className="text-xs font-semibold text-yellow-500">
                                            <i className="fa-solid fa-layer-group mr-1"></i> Fibonacci Retracement
                                            <span className={`ml-2 ${basicAnalysis.fib.trend==='up'?'text-green-400':'text-red-400'}`}>({basicAnalysis.fib.trend==='up'?'▲ ขาขึ้น':'▼ ขาลง'})</span>
                                        </p>
                                        <span className="text-[10px] text-stone-500 leading-tight max-w-xs text-right">แนวรับ/แนวต้านสำคัญ — ราคามักหยุดหรือกลับตัวที่ระดับเหล่านี้</span>
                                    </div>
                                    <div className="grid grid-cols-3 md:grid-cols-6 gap-2 text-xs">
                                        {[
                                            {l:'High',    v:basicAnalysis.fib.high,   c:'text-red-400',    desc:'จุดสูงสุด'},
                                            {l:'78.6%',   v:basicAnalysis.fib.r786,   c:'text-orange-400', desc:'แนวต้านแรง'},
                                            {l:'61.8%',   v:basicAnalysis.fib.r618,   c:'text-yellow-400', desc:'Golden Ratio'},
                                            {l:'50.0%',   v:basicAnalysis.fib.r500,   c:'text-stone-200',  desc:'กึ่งกลาง'},
                                            {l:'38.2%',   v:basicAnalysis.fib.r382,   c:'text-blue-400',   desc:'แนวรับแรง'},
                                            {l:'Low',     v:basicAnalysis.fib.low,    c:'text-green-400',  desc:'จุดต่ำสุด'},
                                        ].map((f,i)=>(
                                            <div key={i} className="text-center bg-stone-900/50 rounded p-1.5">
                                                <p className="text-stone-500 text-[10px]">{f.l}</p>
                                                <p className={`font-bold ${f.c}`}>{f.v}</p>
                                                <p className="text-[9px] text-stone-600">{f.desc}</p>
                                                {displayPrice>0 && Math.abs(displayPrice-f.v)<(basicAnalysis.atr*0.5) && <p className="text-yellow-400 text-[10px] font-bold">◄ ราคาอยู่ใกล้!</p>}
                                            </div>
                                        ))}
                                    </div>
                                    <p className="text-[10px] text-stone-600 mt-2">💡 เมื่อราคาเข้าใกล้ระดับใด ให้รอดู Price Action ก่อนเปิด Order</p>
                                </div>
                            )}

                            {/* Pivot Points */}
                            {basicAnalysis.pivots && (() => {
                                const pv = basicAnalysis.pivots;
                                const pvZone = basicAnalysis.atr * 0.4;
                                const isNear = (v) => displayPrice > 0 && Math.abs(displayPrice - v) < pvZone;
                                const abovePP = displayPrice > 0 && displayPrice > pv.pp;
                                const levels = [
                                    { label:'R3', val:pv.r3, cls:'text-red-300',    bg:'bg-red-950/30',    desc:'แนวต้านแรงมาก' },
                                    { label:'R2', val:pv.r2, cls:'text-red-400',    bg:'bg-red-950/40',    desc:'แนวต้านแรง' },
                                    { label:'R1', val:pv.r1, cls:'text-orange-400', bg:'bg-orange-950/30', desc:'แนวต้านแรก' },
                                    { label:'PP', val:pv.pp, cls:'text-yellow-400', bg:'bg-yellow-950/40', desc:'Pivot กลาง ⭐' },
                                    { label:'S1', val:pv.s1, cls:'text-lime-400',   bg:'bg-green-950/30',  desc:'แนวรับแรก' },
                                    { label:'S2', val:pv.s2, cls:'text-green-400',  bg:'bg-green-950/40',  desc:'แนวรับแรง' },
                                    { label:'S3', val:pv.s3, cls:'text-green-300',  bg:'bg-green-950/30',  desc:'แนวรับแรงมาก' },
                                ];
                                return (
                                    <div className="mt-4 p-3 bg-stone-950 rounded-lg border border-blue-800/40">
                                        <div className="flex items-center justify-between mb-2 flex-wrap gap-1">
                                            <p className="text-xs font-semibold text-blue-400">
                                                <i className="fa-solid fa-crosshairs mr-1"></i> Daily Pivot Points
                                                <span className="ml-2 text-stone-500 font-normal text-[10px]">
                                                    วันก่อนหน้า: H={pv.prevH} L={pv.prevL} C={pv.prevC}
                                                </span>
                                            </p>
                                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${abovePP ? 'bg-green-900/40 text-green-300' : 'bg-red-900/40 text-red-300'}`}>
                                                {abovePP ? '▲ เหนือ PP' : '▼ ต่ำกว่า PP'}
                                            </span>
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            {levels.map((lv, i) => {
                                                const near = isNear(lv.val);
                                                const isPP = lv.label === 'PP';
                                                const isPrice = displayPrice > 0 && (
                                                    (i > 0 && displayPrice <= lv.val && displayPrice > levels[i-1]?.val) ||
                                                    (i === 0 && displayPrice > lv.val)
                                                );
                                                return (
                                                    <div key={lv.label} className={`flex items-center justify-between px-2.5 py-1 rounded-lg text-xs
                                                        ${near ? lv.bg + ' ring-1 ring-yellow-500/40' : isPP ? lv.bg : 'bg-stone-900/30'}
                                                        ${isPP ? 'border border-yellow-700/30' : ''}`}>
                                                        <div className="flex items-center gap-2">
                                                            <span className={`font-bold w-5 ${lv.cls}`}>{lv.label}</span>
                                                            <span className="text-stone-500 text-[10px]">{lv.desc}</span>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            {near && <span className="text-yellow-400 text-[10px] font-bold blink">◄ ใกล้!</span>}
                                                            <span className={`font-mono font-bold ${lv.cls}`}>{lv.val.toFixed(2)}</span>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                        <p className="text-[10px] text-stone-600 mt-1.5">💡 Pivot PP = สมดุลตลาด | เหนือ PP=Bullish bias | ใต้ PP=Bearish bias | R1/S1 = เป้าหมายแรก</p>
                                    </div>
                                );
                            })()}
                        </div>
                    </div>

                    {/* RIGHT */}
                    <div className="flex flex-col gap-5">
                        {/* Account */}
                        <div className={`bg-stone-900 p-4 rounded-xl border shadow-lg ${dailyLimitHit ? 'border-red-600/70' : 'border-stone-800'}`}>
                            {/* Daily Loss Limit Alert */}
                            {dailyLimitHit && (
                                <div className="mb-3 p-2 rounded-lg bg-red-950/50 border border-red-700/60 flex items-center gap-2">
                                    <span className="text-lg blink">⛔</span>
                                    <div>
                                        <p className="text-xs font-bold text-red-400">Daily Loss Limit ถึงแล้ว!</p>
                                        <p className="text-[10px] text-red-300/70">ระงับการเปิด Order ใหม่วันนี้ทั้งหมด — ขาดทุน {dailyStats.dailyLossPct.toFixed(2)}% / {dailyLossLimit}%</p>
                                    </div>
                                </div>
                            )}
                            <div className="grid grid-cols-2 gap-3 mb-3">
                                <div>
                                    <p className="text-xs text-stone-400 mb-1.5 flex items-center"><i className="fa-solid fa-wallet mr-1.5 text-green-400"></i>ทุน (USD)</p>
                                    <div className="flex"><span className="bg-stone-800 px-2.5 py-2 rounded-l-lg font-bold text-stone-300 text-sm">$</span>
                                    <input type="number" value={accountBalance} onChange={e=>setAccountBalance(+e.target.value)} className="bg-stone-950 border border-stone-800 text-white w-full py-2 px-2 rounded-r-lg focus:outline-none focus:border-yellow-500 text-sm"/></div>
                                </div>
                                <div>
                                    <p className="text-xs text-stone-400 mb-1.5 flex items-center"><i className="fa-solid fa-shield-halved mr-1.5 text-blue-400"></i>ความเสี่ยง/ไม้</p>
                                    <div className="flex"><input type="number" value={riskPercentage} onChange={e=>setRiskPercentage(+e.target.value)} step="0.1" min="0.1" max="10" className="bg-stone-950 border border-stone-800 text-white w-full py-2 px-2 rounded-l-lg focus:outline-none focus:border-yellow-500 text-sm"/>
                                    <span className="bg-stone-800 px-2.5 py-2 rounded-r-lg font-bold text-stone-300 text-sm">%</span></div>
                                </div>
                            </div>
                            {/* Daily Loss Limit setting + gauge */}
                            <div className="border-t border-stone-800 pt-3">
                                <div className="flex items-center justify-between mb-1.5">
                                    <p className="text-xs text-stone-400 flex items-center"><i className="fa-solid fa-ban mr-1.5 text-red-400"></i>Daily Loss Limit</p>

                                                </div>
                                            )}
                                            <div className="text-[10px] text-stone-500 font-bold uppercase tracking-wider mb-1.5 flex items-center gap-1">
                                                <i className="fa-solid fa-layer-group"></i> Demand &amp; Supply Zones
                                            </div>
                                            {/* Demand Zones */}
                                            {hasDemand && (
                                                <div className="mb-1.5">
                                                    <div className="text-[9px] text-teal-500 uppercase font-bold mb-1">🟢 Demand Zones (แนวรับ)</div>
                                                    {ds.demandZones.map((z, i) => (
                                                        <div key={i} className={`flex items-center justify-between text-[10px] py-0.5 px-2 rounded mb-0.5 ${z.inZone?'bg-teal-900/40 border border-teal-700/40':z.nearZone?'bg-teal-950/30 border border-teal-900/30':'bg-stone-900/30'}`}>
                                                            <span className={z.inZone?'text-teal-300 font-bold':z.nearZone?'text-teal-400':'text-stone-400'}>
                                                                {z.inZone?'🎯':z.nearZone?'📍':'  '} {z.pattern}
                                                                <span className={`ml-1 text-[9px] ${z.freshness==='FRESH'?'text-green-400':'text-yellow-400'}`}>
                                                                    {z.freshness==='FRESH'?'●FRESH':'○NON-FRESH'}
                                                                </span>
                                                            </span>
                                                            <span className="text-stone-400 font-mono">
                                                                ${z.proximalLine.toLocaleString()} – ${z.distalLine.toLocaleString()}
                                                                {z.inZone && <span className="text-teal-300 ml-1 font-bold">[IN ZONE]</span>}
                                                                {!z.inZone && <span className="text-stone-500 ml-1">↑${ z.distFromPrice.toFixed(0)}</span>}
                                                            </span>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                            {/* Supply Zones */}
                                            {hasSupply && (
                                                <div>
                                                    <div className="text-[9px] text-orange-500 uppercase font-bold mb-1">🔴 Supply Zones (แนวต้าน)</div>
                                                    {ds.supplyZones.map((z, i) => (
                                                        <div key={i} className={`flex items-center justify-between text-[10px] py-0.5 px-2 rounded mb-0.5 ${z.inZone?'bg-orange-900/40 border border-orange-700/40':z.nearZone?'bg-orange-950/30 border border-orange-900/30':'bg-stone-900/30'}`}>
                                                            <span className={z.inZone?'text-orange-300 font-bold':z.nearZone?'text-orange-400':'text-stone-400'}>
                                                                {z.inZone?'🎯':z.nearZone?'📍':'  '} {z.pattern}
                                                                <span className={`ml-1 text-[9px] ${z.freshness==='FRESH'?'text-green-400':'text-yellow-400'}`}>
                                                                    {z.freshness==='FRESH'?'●FRESH':'○NON-FRESH'}
                                                                </span>
                                                            </span>
                                                            <span className="text-stone-400 font-mono">
                                                                ${z.distalLine.toLocaleString()} – ${z.proximalLine.toLocaleString()}
                                                                {z.inZone && <span className="text-orange-300 ml-1 font-bold">[IN ZONE]</span>}
                                                                {!z.inZone && <span className="text-stone-500 ml-1">↓${ z.distFromPrice.toFixed(0)}</span>}
                                                            </span>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                            {!hasDemand && !hasSupply && (
                                                <p className="text-[10px] text-stone-600">ไม่พบ D&S Zone ในช่วงนี้</p>
                                            )}
                                        </div>
                                    );
                                })()}

                                {/* Entry / TP / SL */}
                                <div className="space-y-2 bg-stone-900/50 p-3 rounded-xl border border-stone-800/50">
                                    {[
                                        { label:'จุดเข้า (Entry)', val:aiAnalysis.entryPrice, field:'entry', color: aiAnalysis.signal==='BUY'?'text-green-400':aiAnalysis.signal==='SELL'?'text-red-400':'text-stone-400', sub:`ปัจจุบัน: ${formatCurrency(displayPrice)}` },
                                        { label:'ทำกำไร (TP)', val:aiAnalysis.takeProfit, field:'tp', color:'text-green-400', sub: mmData ? `+${formatCurrency(mmData.expectedProfit)} (RR ${aiAnalysis.rrRatio}:1)` : '' },
                                        { label:'ตัดขาดทุน (SL)', val:aiAnalysis.stopLoss, field:'sl', color:'text-red-400', sub: mmData ? `-${formatCurrency(mmData.riskAmount)} (${riskPercentage}%)` : '' },
                                    ].map(item => (
                                        <div key={item.field} className="flex justify-between items-center pb-2 border-b border-stone-800/50">
                                            <span className="text-stone-400 text-xs">{item.label}:</span>
                                            <div className="flex items-center gap-2">
                                                <div className="text-right">
                                                    <span className={`font-bold text-sm ${item.color}`}>{item.val ? formatCurrency(item.val) : '-'}</span>
                                                    {item.sub && <div className="text-[10px] text-stone-500">{item.sub}</div>}
                                                </div>
                                                <button onClick={() => item.val && handleCopy(item.val.toFixed(2), item.field)} disabled={!item.val} className="p-1.5 bg-stone-800 hover:bg-stone-700 rounded-lg text-stone-400 disabled:opacity-30">
                                                    {copiedField===item.field ? <i className="fa-solid fa-check text-green-400 text-xs"></i> : <i className="fa-regular fa-copy text-xs"></i>}
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                    {mmData && (
                                        <div className="flex justify-between items-center bg-yellow-900/10 p-2 rounded-lg border border-yellow-800/30">
                                            <span className="text-yellow-500 text-xs font-semibold">ขนาด Position:</span>
                                            <div className="flex items-center gap-2">
                                                <div className="text-right">
                                                    <span className="font-bold text-yellow-400">{mmData.lots.toFixed(2)} <span className="text-xs text-yellow-600">lot</span></span>
                                                    <div className="text-[10px] text-stone-500">{mmData.unitsToTrade.toFixed(2)} oz | Margin ~{formatCurrency(mmData.requiredMargin)}</div>
                                                </div>
                                                <button onClick={() => handleCopy(mmData.lots.toFixed(2), 'lot')} className="p-1.5 bg-yellow-900/50 hover:bg-yellow-800 rounded-lg text-yellow-200">
                                                    {copiedField==='lot' ? <i className="fa-solid fa-check text-green-400 text-xs"></i> : <i className="fa-regular fa-copy text-xs"></i>}
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>{/* end grid */}
                </div>{/* end dashboard display wrapper */}

                {/* ประวัติการเทรด */}
                <div style={{display: showHistory ? 'block' : 'none'}}>
                <div className="bg-stone-900 rounded-xl border border-stone-800 shadow-lg p-6">
                    {/* Stats Summary */}
                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6 pb-6 border-b border-stone-800">
                        <div className="bg-black p-4 rounded-lg text-center border border-stone-800">
                            <p className="text-stone-400 text-sm">ทั้งหมด</p>
                            <p className="text-2xl font-bold text-white">{tradeHistory.length}</p>
                        </div>
                        <div className="bg-black p-4 rounded-lg text-center border border-green-900/30">
                            <p className="text-stone-400 text-sm">ชนะ (TP)</p>
                            <p className="text-2xl font-bold text-green-400">{wins.length}</p>
                        </div>
                        <div className="bg-black p-4 rounded-lg text-center border border-red-900/30">
                            <p className="text-stone-400 text-sm">แพ้ (SL)</p>
                            <p className="text-2xl font-bold text-red-400">{losses.length}</p>
                        </div>
                        <div className="bg-black p-4 rounded-lg text-center border border-yellow-900/30">
                            <p className="text-stone-400 text-sm">Win Rate</p>
                            <p className={`text-2xl font-bold ${parseFloat(winRate)>=50?'text-green-400':'text-red-400'}`}>{winRate}%</p>
                        </div>
                        <div className="bg-black p-4 rounded-lg text-center border border-yellow-900/30">
                            <p className="text-stone-400 text-sm">กำไรสุทธิ</p>
                            <p className={`text-2xl font-bold ${netProfit>=0?'text-green-400':'text-red-400'}`}>{netProfit>=0?'+':''}{formatCurrency(netProfit)}</p>
                        </div>
                    </div>
                    {/* Performance Metrics */}
                    <div className="grid grid-cols-3 gap-4 mb-6">
                        <div className="bg-stone-950 p-3 rounded-lg border border-stone-800 text-center">
                            <p className="text-xs text-stone-500">Avg RR (Win)</p>
                            <p className="text-lg font-bold text-blue-400">{avgRR}:1</p>
                        </div>
                        <div className="bg-stone-950 p-3 rounded-lg border border-stone-800 text-center">
                            <p className="text-xs text-stone-500">Streak ปัจจุบัน</p>
                            <p className={`text-lg font-bold ${streakType==='WIN'?'text-green-400':streakType==='LOSS'?'text-red-400':'text-stone-400'}`}>{streak > 0 ? `${streak} ${streakType==='WIN'?'ชนะ🔥':'แพ้💀'}` : '-'}</p>
                        </div>
                        <div className="bg-stone-950 p-3 rounded-lg border border-stone-800 text-center">
                            <p className="text-xs text-stone-500">รอผล</p>
                            <p className="text-lg font-bold text-yellow-400">{pending.length} ไม้</p>
                        </div>
                    </div>

                    {/* Trade Table */}
                    <div className="overflow-x-auto">
                        <table className="w-full text-left text-sm text-stone-300">
                            <thead className="bg-black text-stone-400 uppercase border-b border-stone-800 text-xs">
                                <tr>
                                    <th className="p-3">วัน/เวลา</th>
                                    <th className="p-3">สัญญาณ</th>
                                    <th className="p-3">ราคาเข้า</th>
                                    <th className="p-3">TP / SL</th>
                                    <th className="p-3">Quality</th>
                                    <th className="p-3">สถานะ</th>
                                    <th className="p-3 text-right">กำไร/ขาดทุน</th>
                                </tr>
                            </thead>
                            <tbody>
                                {tradeHistory.length === 0 ? (
                                    <tr><td colSpan="7" className="p-8 text-center text-stone-500">
                                        <i className="fa-solid fa-clock-rotate-left text-3xl mb-2 opacity-50 block"></i>ยังไม่มีประวัติ
                                    </td></tr>
                                ) : tradeHistory.map(t => (
                                    <tr key={t.id} className="border-b border-stone-800/50 hover:bg-stone-800/30 transition-colors">
                                        <td className="p-3 text-stone-400 text-xs">{t.time.toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})}</td>
                                        <td className="p-3"><span className={`px-2 py-1 rounded text-xs font-bold ${t.signal==='BUY'?'bg-green-900/40 text-green-400':'bg-red-900/40 text-red-400'}`}>{t.signal==='BUY'?'▲ BUY':'▼ SELL'}</span></td>
                                        <td className="p-3 font-mono text-xs">{formatCurrency(t.entry)}</td>
                                        <td className="p-3 text-xs font-mono">
                                            <span className="text-green-400">TP: {formatCurrency(t.tp)}</span><br/>
                                            <span className={t.slStatus==='TRAILING'?'text-green-300':t.slStatus==='BREAKEVEN'?'text-yellow-300':'text-red-400'}>
                                                SL: {formatCurrency(t.sl)}
                                                {t.slStatus==='BREAKEVEN' && <span className="ml-1 text-[9px] bg-yellow-900/50 text-yellow-300 px-1 rounded">🛡️BE</span>}
                                                {t.slStatus==='TRAILING'  && <span className="ml-1 text-[9px] bg-green-900/50 text-green-300 px-1 rounded">📈Trail</span>}
                                            </span>
                                        </td>
                                        <td className="p-3">
                                            {t.confidence > 0 && <span className={`text-xs px-2 py-0.5 rounded-full ${t.confidence>=70?'bg-green-900/30 text-green-400':'bg-yellow-900/30 text-yellow-400'}`}>{t.confidence}</span>}
                                        </td>
                                        <td className="p-3 text-xs">
                                            {t.status==='PENDING' && (
                                                <span className="text-yellow-500 flex items-center gap-1">
                                                    <i className="fa-regular fa-clock fa-spin"></i>รอ...
                                                    {t.slStatus==='BREAKEVEN' && <span className="text-yellow-300 text-[9px]">🛡️BE</span>}
                                                    {t.slStatus==='TRAILING'  && <span className="text-green-300 text-[9px]">📈Trail</span>}
                                                </span>
                                            )}
                                            {t.status==='WIN'  && <span className="text-green-400"><i className="fa-solid fa-check mr-1"></i>{t.slStatus==='TRAILING'?'Trail TP':'ชนะ TP'}</span>}
                                            {t.status==='LOSS' && t.profitUsd >= 0 && <span className="text-yellow-400"><i className="fa-solid fa-shield mr-1"></i>Breakeven</span>}
                                            {t.status==='LOSS' && t.profitUsd < 0  && <span className="text-red-400"><i className="fa-solid fa-xmark mr-1"></i>แพ้ SL</span>}
                                        </td>
                                        <td className={`p-3 text-right font-bold text-xs ${t.status==='WIN'?'text-green-400':t.status==='LOSS'?'text-red-400':'text-stone-500'}`}>
                                            {t.status==='PENDING' ? '-' : `${t.profitUsd>=0?'+':''}${formatCurrency(t.profitUsd)}`}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    {tradeHistory.length > 0 && (
                        <div className="mt-4 flex justify-end">
                            <button onClick={() => { if(confirm('ลบประวัติทั้งหมด?')) setTradeHistory([]); }} className="text-xs text-red-500 hover:text-red-400 border border-red-800/50 px-3 py-1.5 rounded-lg transition-colors">
                                <i className="fa-solid fa-trash mr-1"></i> ล้างประวัติ
                            </button>
                        </div>
                    )}
                </div>
                </div>{/* end history display wrapper */}

                <footer className="mt-8 pb-4 text-center text-xs text-stone-600 border-t border-stone-800 pt-4">
                    <p>⚠️ ระบบนี้เป็นเครื่องมือช่วยวิเคราะห์ ไม่ใช่คำแนะนำทางการเงิน การเทรดมีความเสี่ยงสูง</p>
                    <p className="mt-1">Rule-Based Engine • ราคาจาก TradingView / Paxos Gold (Binance) • Chart by TradingView</p>
                </footer>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
